[package]
name = "raiko2-guest-risc0"
version = "0.1.0"
edition = "2021"

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "risc0-shasta-proposal"
path = "src/shasta_proposal.rs"

[[bin]]
name = "risc0-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[dependencies]
raiko2-guest-common = { path = "../common" }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
risc0-zkvm = { version = "3.0.4", default-features = false, features = [
    "std",
    "getrandom",
] }
alloy-primitives = { version = "1.5.0", default-features = false }
bincode = "1.3.3"
c-kzg = { version = "2.1.5", default-features = false, features = ["eip-7594", "ethereum_kzg_settings"] }

[features]
default = []
bench = []

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
rsa = { git = "https://github.com/risc0/RustCrypto-RSA", tag = "v0.9.6-risczero.0" }
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
blst = { git = "https://github.com/risc0/blst", tag = "blst/v0.3.14-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
c-kzg = { git = "https://github.com/risc0/c-kzg-4844", tag = "v2.1.5-risczero.0" }

[workspace]
