[package]
name = "raiko2-guest-zisk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "zisk-shasta-proposal"
path = "src/shasta_proposal.rs"

[[bin]]
name = "zisk-shasta-aggregation"
path = "src/shasta_aggregation.rs"
required-features = ["aggregation"]

[features]
default = []
aggregation = []

[dependencies]
raiko2-guest-common = { path = "../../crates/guest-common", default-features = false }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
alloy-primitives = { version = "=1.6.1", default-features = false }
anyhow = "=1.0.102"
bincode = "=1.3.3"
ziskos = { git = "https://github.com/0xPolygonHermez/zisk", rev = "1e22630bb7e143c30705a1603ed87cfd3da8c6ec", default-features = false, features = ["inputcpy", "zisk-embedded-dlmalloc-alloc"] }

# Keep dependency resolution and any future verified ZisK crypto patches isolated.
# Pure Rust crypto is intentional for this execution experiment.
[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
