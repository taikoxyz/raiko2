[package]
name = "etna-guest-compat-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]

[features]
tiny-keccak = ["alloy-primitives/tiny-keccak"]

[dependencies]
etna-core = { git = "https://github.com/taikoxyz/taiko-mono", rev = "e6e186fe6a2e3912739db9b9cae1740e31064824", default-features = false }
alloy-primitives = { version = "=1.6.1", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
prost = { version = "0.13", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tendermint = { version = "0.40", default-features = false }
tendermint-proto = { version = "0.40", default-features = false }
