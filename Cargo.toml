[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/pipeline",
    "crates/guests",
    "crates/primitives",
    "crates/stateless",
    "crates/provider",
    "crates/engine",
    "crates/prover",
    "crates/protocol",
    "crates/queue",
    "bin/raiko2",
    "bin/rpc-proxy",
]
exclude = ["guests/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.lints.rust]
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
redundant_pub_crate = "warn"
missing_const_for_fn = "warn"

# Always optimize for performance
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

[workspace.dependencies]
# Raiko2 crates
raiko2-primitives = { path = "./crates/primitives" }
raiko2-prover = { path = "./crates/prover" }
raiko2-pipeline = { path = "./crates/pipeline" }
raiko2-provider = { path = "./crates/provider" }
raiko2-engine = { path = "./crates/engine" }
raiko2-stateless = { path = "./crates/stateless" }
raiko2-protocol = { path = "./crates/protocol" }
raiko2-queue = { path = "./crates/queue" }
raiko2-guests = { path = "./crates/guests" }

# zkVM
risc0-zkvm = "3.0.4"
sp1-sdk = "5.2.3"

# Alethia reth (PR #79 branch)
alethia-reth-block = { git = "https://github.com/taikoxyz/alethia-reth", branch = "feat/support_zkvm", default-features = false }
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", branch = "feat/support_zkvm", default-features = false }
alethia-reth-consensus = { git = "https://github.com/taikoxyz/alethia-reth", branch = "feat/support_zkvm", default-features = false }

# Reth (v1.9.3 - same as alethia-reth uses)
reth = { git = "https://github.com/paradigmxyz/reth", package = "reth", tag = "v1.9.3" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-stateless = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }

# Alloy
alloy-rlp = { version = "0.3.4", default-features = false }
alloy-primitives = { version = "1.5.0", default-features = false }
alloy-sol-types = { version = "1.5.0", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
alloy-consensus = { version = "1.0", default-features = false, features = [
    "serde",
] }
alloy-network = { version = "1.0", default-features = false, features = [
    "k256",
] }
alloy-rpc-types = { version = "1.0", default-features = false }
alloy-rpc-types-eth = { version = "1.1.3", default-features = false }
alloy-rpc-client = { version = "1.0", default-features = false, features = [
    "reqwest",
] }
alloy-provider = { version = "1.0", default-features = false, features = [
    "reqwest",
] }
alloy-transport-http = { version = "1.0", default-features = false, features = [
    "reqwest",
] }

# Async, server, http
axum = { version = "0.8.7", features = ["macros"] }
tower-http = { version = "0.6.8", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tokio = { version = "^1.23", features = ["full"] }
reqwest = { version = "0.12.26", features = ["json"] }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.0" }
bincode = "1.3.3"
hex = { version = "0.4.3" }
base64 = "0.22.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# rpc-proxy dependencies
actix-web = "4"
alloy = { version = "1.1.3", features = ["full", "serde"] }
alloy-chains = { version = "0.2.23", features = ["serde"] }
blst = "0.3"
itertools = "0.14"
revm = { version = "33.1.0", default-features = false }
risc0-ethereum-trie = { git = "https://github.com/risc0/risc0-ethereum.git", tag = "v3.0.0" }

# kzg
kzg = { package = "rust-kzg-zkcrypto", git = "https://github.com/grandinetech/rust-kzg.git", default-features = false }
kzg_traits = { package = "kzg", git = "https://github.com/grandinetech/rust-kzg.git", default-features = false }
