name: "Secret Scan"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly full-history scan, Monday 06:00 UTC

permissions:
  contents: read

# Every push range and scheduled audit must run independently. A concurrency
# group can discard pending scans even when cancel-in-progress is false.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Test gitleaks config
        run: python3 scripts/security/test_gitleaks_config.py

      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        run: gitleaks detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --verbose

      # Scan every commit in a push, including secrets added and then removed.
      # Reserve the expensive all-ref history scan for the weekly audit.
      - name: Scan push commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          log_opts=()
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            log_opts=("--log-opts=${BEFORE_SHA}..${AFTER_SHA}")
          else
            # New branches and unavailable force-push bases require a full scan.
            echo "Push base unavailable; scanning full history."
          fi
          gitleaks detect --source . "${log_opts[@]}" --redact --verbose

      - name: Scan full history
        if: github.event_name == 'schedule'
        run: gitleaks detect --source . --redact --verbose
