name: sync-guest-elf

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Guest backend to rebuild
        required: true
        default: all
        type: choice
        options:
          - risc0
          - sp1
          - all
      ref:
        description: Branch to update; defaults to the branch this workflow was dispatched from
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-guest-elf-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      TARGET_REF_INPUT: ${{ inputs.ref }}
      DISPATCH_REF: ${{ github.ref_name }}
    steps:
      - name: resolve target ref
        id: target
        shell: bash
        run: |
          set -eu
          target_ref="$(printf '%s' "${TARGET_REF_INPUT}" | xargs)"
          if [ -z "${target_ref}" ]; then
            target_ref="${DISPATCH_REF}"
          fi
          echo "ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved target ref: ${target_ref}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sync-guest-elf

      - uses: taiki-e/install-action@just

      - name: build guest elfs
        run: just build-guest ${{ inputs.backend }}

      - name: upload guest elf outputs
        uses: actions/upload-artifact@v4
        with:
          name: guest-elf-sync-${{ inputs.backend }}
          path: crates/guests/elf/*.elf
          retention-days: 7

      - name: detect elf changes
        id: changes
        shell: bash
        run: |
          set -eu
          if git diff --quiet -- crates/guests/elf; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No ELF changes detected."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "ELF changes detected."
          fi

      - name: commit synced guest elfs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- crates/guests/elf
          git commit -m "chore: sync guest elf outputs"

      - name: push synced guest elfs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -eu
          git push origin HEAD:${{ steps.target.outputs.ref }}
