services:
  raiko2:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BIN_FEATURES: ${BIN_FEATURES:-}
    image: ${RAIKO2_IMAGE:-raiko2:local}
    container_name: raiko2
    restart: unless-stopped
    init: true
    environment:
      RAIKO2_CONFIG: /etc/raiko2/config.toml
      RAIKO2_HOST: 0.0.0.0
      RAIKO2_PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      RAIKO2_L1_RPC: ${RAIKO2_L1_RPC}
      RAIKO2_L2_RPC: ${RAIKO2_L2_RPC}
      RAIKO2_L1_CHAIN_ID: ${RAIKO2_L1_CHAIN_ID:-1}
      RAIKO2_L2_CHAIN_ID: ${RAIKO2_L2_CHAIN_ID:-167000}
      RAIKO2_PROVER: ${RAIKO2_PROVER:-risc0/local}
      RAIKO2_QUEUE_BACKEND: ${RAIKO2_QUEUE_BACKEND:-memory}
      RAIKO2_QUEUE_NAMESPACE: ${RAIKO2_QUEUE_NAMESPACE:-raiko2:docker}
      RAIKO2_QUEUE_WORKERS: ${RAIKO2_QUEUE_WORKERS:-1}
      RAIKO2_QUEUE_MAINTENANCE_INTERVAL_MS: ${RAIKO2_QUEUE_MAINTENANCE_INTERVAL_MS:-200}
    volumes:
      - ./config.compose.toml:/etc/raiko2/config.toml:ro
    ports:
      - "${RAIKO2_PUBLIC_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
