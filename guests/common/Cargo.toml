[package]
name = "raiko2-guest-common"
version = "0.1.0"
edition = "2021"

[dependencies]
raiko2-primitives = { path = "../../crates/primitives" }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol = { path = "../../crates/protocol" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
raiko2-stateless = { path = "../../crates/stateless" }
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", rev = "be5b43415fb194d53b6be7db5382f026503a248e", default-features = false }
alethia-reth-block = { git = "https://github.com/taikoxyz/alethia-reth", rev = "be5b43415fb194d53b6be7db5382f026503a248e", default-features = false, features = [
    "prover",
    "serde",
] }
alethia-reth-primitives = { git = "https://github.com/taikoxyz/alethia-reth", rev = "be5b43415fb194d53b6be7db5382f026503a248e", default-features = false }
alloy-primitives = { version = "1.5.0", default-features = false }
alloy-consensus = { version = "2.0", default-features = false, features = ["serde"] }
alloy-sol-types = { version = "1.5.0", default-features = false }
alloy-rlp = { version = "0.3.4", default-features = false }
alloy-hardforks = "0.4.7"
anyhow = "1.0"
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false, features = [
    "serde",
] }

[dev-dependencies]
alloy-signer = { version = "1.8.3" }
alloy-signer-local = { version = "1.8.3" }
alloy-trie = { version = "0.9", default-features = false }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }
reth-primitives-traits = { version = "0.3.0", default-features = false }
risc0-ethereum-trie = { git = "https://github.com/risc0/risc0-ethereum.git", tag = "v3.0.1" }

[features]
default = []
bench = []

[workspace]
