name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - '!crates/guests/elf/**'
              - 'bin/**'
              - 'guests/**'
              - 'xtask/**'
              - 'config/**'
              - 'test.json'
              - 'justfile'
            workflow:
              - '.github/workflows/ci.yml'

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"
          components: clippy

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      # Keep the main clippy lane on fast foundational crates plus preflight. The heavier
      # prover/engine/server stack is covered by the manually dispatched rust-heavy workflow.
      - name: clippy
        run: >
          cargo clippy
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta
          -p raiko2-guests
          -p raiko2-provider
          -p raiko2-pipeline
          -p raiko2-queue
          -p raiko2-runtime
          -p raiko2-stateless
          -p preflight
          --
          -D warnings

  rust-test-foundation:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      # Split test lanes by dependency weight to stay under runner disk limits.
      - name: test foundation
        run: >
          cargo test
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta

  rust-test-pipeline:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      # build-guest-{risc0,sp1} already exercise xtask's guest build path.
      # Keep default Rust test lanes off xtask because that package drags both zk stacks
      # into cold-start test compiles.
      - name: test pipeline
        run: >
          cargo test
          -p raiko2-provider
          -p raiko2-pipeline
          -p preflight

  rust-test-runtime:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      - name: test runtime
        run: >
          cargo test
          -p raiko2-queue
          -p raiko2-runtime

  # Keep the prover/engine/server stack out of the default PR gate for now; those heavier lanes
  # are covered by the manually dispatched rust-heavy workflow.
  rust:
    needs:
      - changes
      - rust-fmt
      - rust-clippy
      - rust-test-foundation
      - rust-test-pipeline
      - rust-test-runtime
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: verify rust lanes
        env:
          FMT_RESULT: ${{ needs.rust-fmt.result }}
          CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          TEST_FOUNDATION_RESULT: ${{ needs.rust-test-foundation.result }}
          TEST_PIPELINE_RESULT: ${{ needs.rust-test-pipeline.result }}
          TEST_RUNTIME_RESULT: ${{ needs.rust-test-runtime.result }}
        run: |
          test "${FMT_RESULT}" = "success"
          test "${CLIPPY_RESULT}" = "success"
          test "${TEST_FOUNDATION_RESULT}" = "success"
          test "${TEST_PIPELINE_RESULT}" = "success"
          test "${TEST_RUNTIME_RESULT}" = "success"
