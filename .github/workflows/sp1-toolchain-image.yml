name: build-sp1-toolchain-image

on:
  push:
    branches:
      - main
    paths:
      - docker/sp1-toolchain/**
      - .github/workflows/sp1-toolchain-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Set to true to force a rebuild"
        required: true
        default: "false"

# Default to read-only at the workflow level; only the build job needs to push
# to GHCR.
permissions:
  contents: read

concurrency:
  group: sp1-toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/sp1-toolchain/**'
              - '.github/workflows/sp1-toolchain-image.yml'

  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Keep in sync with rust-toolchain.toml.
      RUST_VERSION: "1.95.0"
      # Keep in sync with guests/sp1/Cargo.lock (sp1-zkvm version), but with a leading 'v' (e.g. v6.3.0).
      SP1_DOCKER_TAG: "v6.3.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/sp1-toolchain
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/sp1-toolchain
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sp1-toolchain
          cache-to: type=gha,mode=max,scope=sp1-toolchain
          provenance: true
          sbom: true
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            SP1_DOCKER_TAG=${{ env.SP1_DOCKER_TAG }}
