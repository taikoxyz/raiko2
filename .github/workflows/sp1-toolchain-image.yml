name: build-sp1-toolchain-image

on:
  push:
    branches:
      - main
    paths:
      - docker/sp1-toolchain/**
      - .github/workflows/sp1-toolchain-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Set to true to force a rebuild"
        required: true
        default: "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: sp1-toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/sp1-toolchain/**'
              - '.github/workflows/sp1-toolchain-image.yml'

  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force == 'true')
    runs-on: ubuntu-latest
    env:
      # Keep in sync with rust-toolchain.toml.
      RUST_VERSION: "1.93"
      # Keep in sync with guests/sp1/Cargo.lock (sp1-zkvm version), but with a leading 'v' (e.g. v5.2.4).
      SP1_DOCKER_TAG: "v5.2.4"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/sp1-toolchain
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: docker/sp1-toolchain
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sp1-toolchain
          cache-to: type=gha,mode=max,scope=sp1-toolchain
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            SP1_DOCKER_TAG=${{ env.SP1_DOCKER_TAG }}

