name: rust-heavy

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Heavy Rust lane to run
        required: true
        default: all
        type: choice
        options:
          - prover
          - engine
          - server
          - all
      ref:
        description: Branch to test; defaults to the branch this workflow was dispatched from
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-heavy-${{ github.event.inputs.ref || github.ref }}-${{ github.event.inputs.lane || 'all' }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
    env:
      TARGET_REF_INPUT: ${{ inputs.ref }}
      DISPATCH_REF: ${{ github.ref_name }}
    steps:
      - name: resolve target ref
        id: target
        shell: bash
        run: |
          set -eu
          target_ref="$(printf '%s' "${TARGET_REF_INPUT}" | xargs)"
          if [ -z "${target_ref}" ]; then
            target_ref="${DISPATCH_REF}"
          fi
          echo "ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved target ref: ${target_ref}"

  test-prover:
    needs: resolve-ref
    if: inputs.lane == 'prover' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: rui314/setup-mold@v1

      - name: print resolved revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: print boundless dependency path when present
        shell: bash
        run: |
          set -eu
          cargo tree -i boundless-market -p raiko2-prover || \
            echo "boundless-market is not in the default feature graph"

      - name: test prover
        run: cargo test -p raiko2-prover -p guest-launcher

      - name: dump boundless generated source on failure
        if: failure()
        shell: bash
        run: |
          set -eu
          if [ ! -d target/debug/build ]; then
            echo "target/debug/build missing; no boundless generated source to dump"
            exit 0
          fi
          find target/debug/build -path '*boundless_market_generated.rs' -print || true
          for f in $(find target/debug/build -path '*boundless_market_generated.rs' 2>/dev/null); do
            echo "FILE:${f}"
            sha256sum "${f}"
            sed -n '1,40p' "${f}"
            echo "---TAIL---"
            tail -n 40 "${f}"
          done

  test-engine:
    needs: resolve-ref
    if: inputs.lane == 'engine' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: rui314/setup-mold@v1

      - name: print resolved revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: print boundless dependency path when present
        shell: bash
        run: |
          set -eu
          cargo tree -i boundless-market -p raiko2-engine || \
            echo "boundless-market is not in the default feature graph"

      - name: test engine
        run: cargo test -p raiko2-engine

      - name: dump boundless generated source on failure
        if: failure()
        shell: bash
        run: |
          set -eu
          if [ ! -d target/debug/build ]; then
            echo "target/debug/build missing; no boundless generated source to dump"
            exit 0
          fi
          find target/debug/build -path '*boundless_market_generated.rs' -print || true
          for f in $(find target/debug/build -path '*boundless_market_generated.rs' 2>/dev/null); do
            echo "FILE:${f}"
            sha256sum "${f}"
            sed -n '1,40p' "${f}"
            echo "---TAIL---"
            tail -n 40 "${f}"
          done

  test-server:
    needs: resolve-ref
    if: inputs.lane == 'server' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: rui314/setup-mold@v1

      - name: print resolved revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: print boundless dependency path when present
        shell: bash
        run: |
          set -eu
          cargo tree -i boundless-market -p raiko2 || \
            echo "boundless-market is not in the default feature graph"

      - name: test server
        run: cargo test -p raiko2

      - name: dump boundless generated source on failure
        if: failure()
        shell: bash
        run: |
          set -eu
          if [ ! -d target/debug/build ]; then
            echo "target/debug/build missing; no boundless generated source to dump"
            exit 0
          fi
          find target/debug/build -path '*boundless_market_generated.rs' -print || true
          for f in $(find target/debug/build -path '*boundless_market_generated.rs' 2>/dev/null); do
            echo "FILE:${f}"
            sha256sum "${f}"
            sed -n '1,40p' "${f}"
            echo "---TAIL---"
            tail -n 40 "${f}"
          done
