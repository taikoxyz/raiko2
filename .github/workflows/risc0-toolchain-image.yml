name: build-risc0-toolchain-image

on:
  push:
    branches:
      - main
    paths:
      - docker/risc0-toolchain/**
      - .github/workflows/risc0-toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: risc0-toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/risc0-toolchain/**'
              - '.github/workflows/risc0-toolchain-image.yml'

  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/risc0-toolchain
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: docker/risc0-toolchain
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=risc0-toolchain
          cache-to: type=gha,mode=max,scope=risc0-toolchain
