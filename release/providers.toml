# External TEE providers are pinned by exact source commit for release provenance.
# Release execution reads this file and must not follow branch tips at runtime.
# Each attestation_path must point at a baked metadata file inside the built image.
[providers.gaiko2]
repo = "https://github.com/smtmfft/gaiko2.git"
commit = "fa1b9ad205e6293eb64b10876e210893765b93f4"
provider = "gaiko2-sgxgeth"
lane = "sgxgeth"
image_name = "gaiko2-sgxgeth"
repository = "us-docker.pkg.dev/evmchain/images/gaiko2-sgxgeth"
dockerfile = "docker/Dockerfile.tee"
context = "."
attestation_path = "/opt/gaiko2/etc/attestation.json"
