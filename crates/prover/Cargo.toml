[package]
name = "raiko2-prover"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace dependencies
raiko2-primitives.workspace = true
raiko2-primitives-shasta.workspace = true
raiko2-protocol-shasta.workspace = true
raiko2-pipeline.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bincode.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tokio.workspace = true
hex.workspace = true
secp256k1.workspace = true

anyhow.workspace = true

# Alloy types
alloy-primitives.workspace = true

# RISC0 dependencies (optional)
risc0-zkvm = { workspace = true, optional = true }

# SP1 dependencies (optional)
sp1-sdk = { workspace = true, optional = true }

# TDX dependencies (optional)
dirs = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[features]
default = ["zkvm"]
zkvm = ["dep:risc0-zkvm", "dep:sp1-sdk"]
tdx = ["dep:dirs", "dep:rand"]

[dev-dependencies]
httpmock = "0.7"
