name: cuda-image

# Builds the NVIDIA GPU runtime image (Dockerfile.cuda) without pushing, so the `cuda` feature
# (RISC0 CUDA kernels via nvcc, SP1 sp1-gpu-server wiring) keeps compiling on GPU-less runners.
# Publishing goes through the same xtask entrypoint: the `release-image.yml` workflow
# (flavor=cuda) or `just release-image-cuda <backend> <tag>`.

on:
  pull_request:
    paths:
      - 'Dockerfile.cuda'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # The image compiles every crate raiko2 depends on, and `cuda`-gated code is compiled
      # nowhere else.
      - 'crates/**'
      - '!crates/guests/elf/**'
      - 'bin/**'
      - 'xtask/**'
      - 'config/**'
      - '.github/workflows/cuda-image.yml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.cuda'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # The image compiles every crate raiko2 depends on, and `cuda`-gated code is compiled
      # nowhere else.
      - 'crates/**'
      - '!crates/guests/elf/**'
      - 'bin/**'
      - 'xtask/**'
      - 'config/**'
      - '.github/workflows/cuda-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-image-${{ github.ref }}
  # Supersede stale PR builds. On main a running build is never cancelled, but GitHub keeps only
  # one pending run per group, so a queued main build is replaced by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CUDA devel base image plus a release build of raiko2 needs more disk than the
      # hosted runner leaves free by default.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: build CUDA runtime image
        env:
          VCS_REF: ${{ github.sha }}
        run: |
          docker buildx build \
            --file Dockerfile.cuda \
            --build-arg "VCS_REF=${VCS_REF}" \
            --tag raiko2-cuda:ci \
            --load \
            .

      - name: inspect image
        run: |
          docker run --rm --entrypoint /root/.sp1/bin/sp1-gpu-server raiko2-cuda:ci --version
          # raiko2 links libcuda.so.1, which only the host driver provides (`--gpus all`), so it
          # cannot start on this GPU-less runner. Fail on any other unresolved shared library.
          docker run --rm --entrypoint sh raiko2-cuda:ci -c '
            set -eu
            ldd /usr/local/bin/raiko2
            missing="$(ldd /usr/local/bin/raiko2 | grep "not found" | grep -v "libcuda.so.1" || true)"
            if [ -n "$missing" ]; then
              echo "raiko2 has unresolved shared libraries:" >&2
              echo "$missing" >&2
              exit 1
            fi'
