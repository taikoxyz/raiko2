# Example configuration for the raiko2 prover server.
#
# Load with:
#   raiko2 --config ./config.toml
# or:
#   RAIKO2_CONFIG=./config.toml raiko2
#
# CLI flags and environment variables override values from this file.

[server]
host = "0.0.0.0"
port = 8080

[rpc]
# Explicitly allowed (network, l1_network) combinations for the hoodi-compatible API.
pairs = [
  { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "http://34.71.217.85:8545" },
]

# Optional single-pair fallback for legacy deployments. Ignored when `rpc.pairs` is non-empty.
l1_rpc = "http://localhost:8545"
l2_rpc = "http://localhost:9545"
l1_chain_id = 1
l2_chain_id = 167000

[rpc.client]
timeout_ms = 10000
concurrency_limit = 32

[rpc.client.retry]
max_attempts = 3
initial_backoff_ms = 500
compute_units_per_second = 1000

[runtime]
root = "./data/runtime"

[prover]
# Server default route.
# Supported routes:
#   risc0/local | risc0/boundless | sp1/local | native/local
guest_system = "risc0"
runner = "local"

[prover.risc0]
bonsai = true
snark = true
mock = false

[prover.sp1]
network = true
plonk = true

[prover.boundless]
offchain = true
rpc_url = "https://base-rpc.publicnode.com"
signer_key = "0xYOUR_PRIVATE_KEY"
poll_interval_ms = 10000
timeout_ms = 3600000

[prover.boundless.deployment]
deployment_type = "base"

[prover.boundless.deployment.overrides]
order_stream_url = "https://base-mainnet.boundless.network"

[prover.boundless.offer_params.batch]
ramp_up_start_sec = 2
ramp_up_period_blocks = 60
lock_timeout_ms_per_mcycle = 150
timeout_ms_per_mcycle = 310
max_price_per_mcycle = "0.000000085"
min_price_per_mcycle = "0.000000005"
lock_collateral = "20"

[prover.boundless.offer_params.aggregation]
ramp_up_start_sec = 2
ramp_up_period_blocks = 60
lock_timeout_ms_per_mcycle = 1500
timeout_ms_per_mcycle = 3000
max_price_per_mcycle = "0.00000006"
min_price_per_mcycle = "0.000000006"
lock_collateral = "20"

[queue]
backend = "memory"
namespace = "raiko2:queue"
workers = 1
maintenance_interval_ms = 200
# redis_url = "redis://localhost:6379/"

[queue.retry]
strategy = "exponential"
max_attempts = 3
fixed_delay_ms = 1000
base_delay_ms = 1000
max_delay_ms = 30000
