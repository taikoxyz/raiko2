# Example configuration for the raiko2 prover server.
#
# Load with:
#   raiko2 --config ./config.toml
# or:
#   RAIKO2_CONFIG=./config.toml raiko2
#
# CLI flags and explicitly supported environment variables override values from this file.

[server]
host = "0.0.0.0"
port = 8080
# Optional: enables `GET /admin/ballot` and `POST /admin/ballot`.
# Keep unset to disable the admin API.
# admin_api_key = "change-me"

[rpc]
# Explicitly allowed (network, l1_network) combinations for the hoodi-compatible API.
# Canonical configs should declare RPC endpoints here.
pairs = [
  { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", l2_provider = "geth_local_witness" },
  # Optional: route witness/debug traffic to a dedicated L2 endpoint.
  # l2_provider defaults to "reth". Set l2_provider = "geth" for geth native debug_executionWitness.
  # Set l2_provider = "geth_local_witness" for a regular geth endpoint with locally assembled witnesses.
  # { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", l2_provider = "geth", l2_witness_rpc = "https://rpc.hoodi.taiko.xyz" },
  # Optional: enable hosted SP1 network verification for a specific pair.
  # sp1_verifier_address is the Succinct SP1 PLONK gateway on L1, not the Taiko Shasta verifier.
  # Leave these fields unset to keep that line closed.
  # { network = "taiko_mainnet", l1_network = "ethereum", l1_rpc = "https://ethereum-rpc.publicnode.com", l2_rpc = "https://rpc.mainnet.taiko.xyz", l2_witness_rpc = "https://rpc.mainnet.taiko.xyz", sp1_verifier_rpc_url = "https://ethereum-rpc.publicnode.com", sp1_verifier_address = "0x3B6041173B80E77f038f3F2C0f9744f04837185e" },
  # Optional: override Boundless quote and offer params per pair.
  # This only affects the `risc0/network` route. SP1 ignores it.
  # { network = "taiko_mainnet", l1_network = "ethereum", l1_rpc = "https://ethereum-rpc.publicnode.com", l2_rpc = "https://taiko-rpc.publicnode.com", boundless = { batch_quoted_mcycles = 6000, aggregation_quoted_mcycles = 200 } },
  # { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", boundless = { batch_quoted_mcycles = 6000, aggregation_quoted_mcycles = 200, offer_params = { batch = { pricing_mode = "market", max_price_per_mcycle = "0.000000060", ramp_up_start_sec = 20, ramp_up_period_blocks = 60, lock_timeout_ms_per_mcycle = 200, timeout_ms_per_mcycle = 410, lock_collateral = "20" } } } },
]

[rpc.client]
timeout_ms = 600000
concurrency_limit = 32

[rpc.client.retry]
max_attempts = 4
initial_backoff_ms = 1000
compute_units_per_second = 1000

[runtime]
root = "./data/runtime"
inactive_ttl_secs = 7200

# Optional preflight cross-check against a second L2 RPC endpoint.
# Keys are L2 network names from rpc.pairs[*].network. Omit a network to skip verification.
# [preflight.verify_checkpoint_l2_rpcs]
# taiko_hoodi = "https://hoodi-l2-rpc.example.com"

[prover]
# Server default route.
# Supported routes:
# Public proof requests use proof_type = "risc0" or "sp1"; "zk_any" is sampling only.
# Internal regression environments may use proof_type = "native" with route native/local.
# Routes supported by server config:
#   risc0/local | risc0/network | sp1/local | sp1/network | native/local | sgx/remote
guest_system = "risc0"
runner = "local"

[prover.risc0]
bonsai = true
snark = true
mock = false
execution_po2 = 20

[prover.sp1]
mode = "prove"
prover = "network"
recursion = "plonk"
verify = true
network_mode = "reserved"
fulfillment_strategy = "reserved"
skip_simulation = true
cycle_limit = 1000000000000
# Optional SP1 stage-specific cycle limits. If unset, `cycle_limit` is used.
# proposal_cycle_limit = 1000000000000
# aggregation_cycle_limit = 1000000000000
timeout_secs = 7200
# rpc_url = "https://rpc.production.succinct.xyz"

[prover.boundless]
# Global default for the `risc0/network` route. Pair-specific overrides under `rpc.pairs[*].boundless`
# can replace `batch_quoted_mcycles`, `aggregation_quoted_mcycles`, and either offer param block
# for selected pairs.
offchain = false
rpc_url = "https://base-rpc.publicnode.com"
signer_key = "0xYOUR_PRIVATE_KEY"
batch_quoted_mcycles = 6000
batch_quote_strategy = "raiko_agent"
aggregation_quoted_mcycles = 200
poll_interval_ms = 10000
timeout_ms = 3600000

# Optional request sampling policy for proof_type=zk_any.
# When disabled or not drawn, the server returns data.status = "zk_any_not_drawn"
# and does not register a task.
#
# [prover.zk_any.sp1]
# probability = 0.05
# per_day = 8
#
# [prover.zk_any.risc0]
# probability = 0.05
# per_day = 8

[prover.remote_sgx]
# For `proof_type=sgx`, point this at the dedicated SGX runtime (`raiko2-sgx-prover`). That
# runtime may run in `tee` or `native` mode.
base_url = "http://127.0.0.1:8081"
# For `proof_type=sgxgeth`, point this at the external geth-backed remote SGX server.
sgxgeth_base_url = "http://127.0.0.1:8090"
timeout_ms = 300000

[prover.boundless.deployment]
# Supported deployments: base, sepolia, taiko.
# Use taiko when submitting Boundless requests to the Taiko mainnet market.
deployment_type = "base"

[prover.boundless.deployment.overrides]
order_stream_url = "https://base-mainnet.boundless.network"

[prover.boundless.offer_params.batch]
pricing_mode = "market"
# Optional in market mode: cap the SDK autoprice maxPrice after cycle and gas estimation.
max_price_per_mcycle = "0.000000060"
ramp_up_start_sec = 20
ramp_up_period_blocks = 60
lock_timeout_ms_per_mcycle = 200
timeout_ms_per_mcycle = 410
lock_collateral = "20"

[prover.boundless.offer_params.aggregation]
pricing_mode = "market"
ramp_up_start_sec = 20
ramp_up_period_blocks = 60
lock_timeout_ms_per_mcycle = 3000
timeout_ms_per_mcycle = 6000
lock_collateral = "20"

[queue]
backend = "memory"
namespace = "raiko2:queue"
workers = 6
maintenance_interval_ms = 200
task_timeout_secs = 14400
# redis_url = "redis://localhost:6379/"
