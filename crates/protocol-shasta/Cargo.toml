[package]
name = "raiko2-protocol-shasta"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taiko Shasta protocol types and codecs for Raiko V2"

[lints]
workspace = true

[dependencies]
raiko2-protocol.workspace = true
taiko-client-protocol.workspace = true

# Alloy types
alethia-reth-consensus.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-eips.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

# Logging
tracing.workspace = true

[features]
default = []
net = ["taiko-client-protocol/net"]

[dev-dependencies]
alloy-rlp.workspace = true
alloy-primitives.workspace = true
flate2.workspace = true
tracing-subscriber.workspace = true
