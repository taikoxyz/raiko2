name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      guest_artifacts: ${{ steps.filter.outputs.guest_artifacts }}
      opcode_gas: ${{ steps.filter.outputs.opcode_gas }}
      zkgas_model: ${{ steps.filter.outputs.zkgas_model }}
      workflow: ${{ steps.filter.outputs.workflow }}
      quantifier_canary: ${{ steps.filter.outputs.quantifier_canary }}
      # Single source of truth for lane admission. Every Rust lane `if:` and the `rust` gate read
      # these two instead of restating the filter union, so a filter added to one lane cannot
      # drift from the gate that observes it (that drift is how `opcode_gas` went unobserved).
      rust_full: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      rust_any: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.guest_artifacts == 'true' || steps.filter.outputs.opcode_gas == 'true' || steps.filter.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Load-bearing for the `!crates/guests/elf/**` exclusion in `rust` below. The default
          # quantifier (`some`) ORs every pattern of a filter together, and a negated pattern
          # matches every file *outside* what it excludes -- which made `rust` unconditionally
          # true for any change at all. `some-with-excludes` is the intended "matches at least
          # one include and no exclude". Do not drop this while any filter uses a `!` pattern.
          # The `quantifier_canary` filter below turns a lost or ignored input into a red `rust` gate.
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # `bin/raiko2`'s config tests parse and validate the canonical example config.
              - 'config.example.toml'
              - 'crates/**'
              # ELF-only changes match `guest_artifacts` instead and run only `rust-test-xtask`
              # (provenance `all --check` and the guest-digests tests over the committed ELF/vk
              # bytes). That deliberately skips `rust-test-prover`/`rust-test-pipeline`, whose
              # tests also load these bytes; the `rust` gate's `FULL_RUST_LANES_REQUIRED` split
              # expects exactly this routing.
              - '!crates/guests/elf/**'
              - 'bin/**'
              - 'guests/**'
              - 'xtask/**'
              - 'config/**'
              # Guest toolchain Dockerfiles are hashed into the provenance source fingerprint
              # (without this a docker-only change would skip `all --check` and merge stale
              # provenance), and the xtask TEE release tests assert on the root `Dockerfile.sgx`.
              - 'docker/**'
              - 'Dockerfile*'
              # `test/guest_inputs/**` is read by the prover's native-backend unit tests.
              - 'test/**'
              - 'justfile'
              # Checked-in fixtures are embedded by tests in several lanes: the shared Shasta
              # GuestInput fixture (primitives-shasta bincode roundtrip, fixture-server e2e) and
              # the zkGas validation fixture that `boundless::estimation` include_str!s and pins by
              # SHA-256. A fixture-only edit must still run those lanes.
              - 'tests/**'
            guest_artifacts:
              - 'crates/guests/elf/**'
            opcode_gas:
              - 'experiments/opcode-gas/**'
            zkgas_model:
              - 'scripts/modeling/**'
              - 'experiments/opcode-gas/**'
              - 'experiments/risc0-zkgas/**'
              - 'tests/fixtures/risc0-zkgas/**'
              - 'crates/prover/models/**'
              - 'xtask/src/export_unzen_zk_gas_schedule.rs'
              - 'justfile'
            workflow:
              - '.github/workflows/ci.yml'
            # Negated-only filter: under `some-with-excludes` it can never match, but under the
            # default `some` quantifier picomatch inverts the pattern and it matches every changed
            # file. The `rust` gate fails when it is true, so a lost or ignored
            # `predicate-quantifier` input (key dropped, moved into this block, or renamed
            # upstream) cannot silently revert `rust` to matching everything again.
            quantifier_canary:
              - '!__quantifier_canary_sentinel__'

  zkgas-model:
    needs: changes
    if: needs.changes.outputs.zkgas_model == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # The generator is stdlib-only by design; no dependency install step is needed.
      - name: test zkGas model tooling
        run: |
          python -m unittest discover -s scripts/modeling/tests
          python -m unittest discover -s experiments/opcode-gas/tests
          python -m unittest discover -s experiments/risc0-zkgas/tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # Proves the committed runtime artifact is still exactly what the fixture regenerates.
      # Both paths are left at the generator's defaults so this lane never becomes another
      # hardcoded fixture-path copy to update at the next model promotion.
      - name: check committed zkGas model artifact
        run: python scripts/modeling/risc0_zkgas_model.py check
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"
          components: clippy

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust

      # Keep clippy on fast foundational crates plus the backend-neutral engine
      # core and preflight. Full prover-stack checks remain in the manual heavy
      # workflow.
      - name: clippy
        run: >
          cargo clippy
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta
          -p raiko2-guest-common
          -p raiko2-guests
          -p raiko2-provider
          -p raiko2-pipeline
          -p raiko2-queue
          -p raiko2-runtime
          -p raiko2-stateless
          -p preflight
          --
          -D warnings

      - name: clippy engine core
        run: cargo clippy -p raiko2-engine --no-default-features -- -D warnings

  rust-test-foundation:
    needs: changes
    if: needs.changes.outputs.rust_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust

      # Split test lanes by dependency weight to stay under runner disk limits.
      - name: test foundation
        run: >
          cargo test
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta
          -p raiko2-guest-common

  rust-test-pipeline:
    needs: changes
    if: needs.changes.outputs.rust_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust

      # build-guest-{risc0,sp1} already exercise xtask's guest build path.
      # Keep default Rust test lanes off xtask because that package drags both zk stacks
      # into cold-start test compiles.
      - name: test pipeline
        run: >
          cargo test
          -p raiko2-provider
          -p raiko2-pipeline
          -p preflight

  rust-test-runtime:
    needs: changes
    if: needs.changes.outputs.rust_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust

      - name: test runtime
        run: >
          cargo test
          -p raiko2-queue
          -p raiko2-runtime

      # The engine state-machine tests only need the backend-neutral core.
      # Disabling default features avoids compiling the RISC0, SP1, and
      # Boundless prover stacks in the PR gate.
      - name: test engine core
        run: cargo test -p raiko2-engine --no-default-features

  # PR-gate lane for the prover crate: the boundless bidding/money-path and recovery unit
  # tests previously ran only in the manually dispatched rust-heavy workflow, so a pricing
  # or rebid regression could merge green. `--lib` keeps this lane to unit tests;
  # integration tests and the server stack stay on rust-heavy. Debug info is disabled to
  # keep the zk-stack build inside runner disk limits, and the cache key is separate from
  # the light lanes so the heavy prover artifacts don't evict their shared cache.
  rust-test-prover:
    needs: changes
    if: needs.changes.outputs.rust_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      # prost-build in the prover dependency tree shells out to protoc, which the hosted
      # runner image does not ship.
      - name: install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-prover

      - name: test prover
        run: cargo test -p raiko2-prover --lib

      - name: test optional Boundless S3 support
        run: cargo test -p raiko2-prover --lib --features boundless-s3

      - name: verify default host excludes Boundless S3 SDK
        run: |
          if cargo tree -p raiko2 -i aws-sdk-s3; then
            echo "::error::default raiko2 dependency graph unexpectedly includes aws-sdk-s3"
            exit 1
          fi

  rust-test-xtask:
    needs: changes
    if: needs.changes.outputs.rust_any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RISC0_SKIP_BUILD_KERNELS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust

      - name: test xtask build guest
        run: cargo test -p xtask-build-guest --features digests

      - name: verify guest artifact provenance
        run: cargo run -p xtask-build-guest --bin xtask-build-guest -- all --check

      - name: test Unzen schedule exporter invariants
        run: cargo test -p xtask --no-default-features export_unzen_zk_gas_schedule

      - name: test Unzen schedule Rust-Python roundtrip
        run: >
          python experiments/opcode-gas/tests/test_inventory.py
          InventoryTests.test_rust_exporter_round_trips_through_python_loader
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          RAIKO2_TEST_UNZEN_SCHEDULE_ROUNDTRIP: "1"

      - name: test xtask register image
        run: cargo test -p xtask register_image

      - name: test xtask TEE provider release
        run: cargo test -p xtask --no-default-features --features tee-provider-release release_tee

      - name: test fixture server feature
        run: cargo test -p raiko2 --bin raiko2 --features fixture-server

  # The server stack stays out of the default PR gate for now (covered by the manually
  # dispatched rust-heavy workflow); prover lib tests are gated via rust-test-prover and
  # the backend-neutral engine core via the runtime lane.
  rust:
    needs:
      - changes
      - rust-fmt
      - rust-clippy
      - rust-test-foundation
      - rust-test-pipeline
      - rust-test-runtime
      - rust-test-prover
      - rust-test-xtask
    # This gate is the required status check that observes the lanes which are not required on
    # their own (rust-test-{pipeline,runtime,prover,xtask}; rust-fmt, rust-clippy and
    # rust-test-foundation are required separately). It runs whenever any lane in `needs` could
    # have run (`rust_any` is the union of every lane's admission), whenever the `changes` job did
    # not succeed (its outputs are then empty, every lane is skipped, and a skipped required check
    # reports Success -- so the gate must run and fail instead), and whenever the quantifier
    # canary trips. Do not add a lane to `needs` without routing its admission through `rust_any`.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rust_any == 'true' || needs.changes.outputs.quantifier_canary == 'true')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: verify rust lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUANTIFIER_CANARY: ${{ needs.changes.outputs.quantifier_canary }}
          FULL_RUST_LANES_REQUIRED: ${{ needs.changes.outputs.rust_full }}
          FMT_RESULT: ${{ needs.rust-fmt.result }}
          CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          TEST_FOUNDATION_RESULT: ${{ needs.rust-test-foundation.result }}
          TEST_PIPELINE_RESULT: ${{ needs.rust-test-pipeline.result }}
          TEST_RUNTIME_RESULT: ${{ needs.rust-test-runtime.result }}
          TEST_PROVER_RESULT: ${{ needs.rust-test-prover.result }}
          TEST_XTASK_RESULT: ${{ needs.rust-test-xtask.result }}
        run: |
          echo "changes=${CHANGES_RESULT} quantifier_canary=${QUANTIFIER_CANARY} full_rust_lanes_required=${FULL_RUST_LANES_REQUIRED}"
          echo "fmt=${FMT_RESULT} clippy=${CLIPPY_RESULT} foundation=${TEST_FOUNDATION_RESULT} pipeline=${TEST_PIPELINE_RESULT} runtime=${TEST_RUNTIME_RESULT} prover=${TEST_PROVER_RESULT} xtask=${TEST_XTASK_RESULT}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::the changes job finished with '${CHANGES_RESULT}', so no lane was selected and nothing was tested"
            exit 1
          fi
          if [ "${QUANTIFIER_CANARY}" = "true" ]; then
            echo "::error::paths-filter predicate-quantifier is not in effect: a negated-only filter matched, so the rust filter's '!crates/guests/elf/**' exclusion is inverted and every change selects every Rust lane"
            exit 1
          fi
          test "${TEST_XTASK_RESULT}" = "success"
          if [ "${FULL_RUST_LANES_REQUIRED}" = "true" ]; then
            test "${FMT_RESULT}" = "success"
            test "${CLIPPY_RESULT}" = "success"
            test "${TEST_FOUNDATION_RESULT}" = "success"
            test "${TEST_PIPELINE_RESULT}" = "success"
            test "${TEST_RUNTIME_RESULT}" = "success"
            test "${TEST_PROVER_RESULT}" = "success"
          fi
