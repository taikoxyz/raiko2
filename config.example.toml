# Example configuration for the raiko2 prover server.
#
# Load with:
#   raiko2 --config ./config.toml
# or:
#   RAIKO2_CONFIG=./config.toml raiko2
#
# CLI flags and explicitly supported environment variables override values from this file.
#
# String settings can reference a process environment variable with a singleton
# inline table, for example `{ env = "RAIKO2_SUBMIT_API_KEY" }`. The
# reference is resolved before schema validation; it does not support shell
# expansion or partial string interpolation.

[server]
host = "0.0.0.0"
port = 8080
# Optional: enables ACL-protected endpoints.
# V4 submit/task endpoints stay public unless a key allows "prover.submit" or "admin".
# ACL key id and key values must be unique.
# [server.acl]
# keys = [
#   { id = "admin", key = { env = "RAIKO2_ADMIN_API_KEY" }, allow = ["admin"] },
#   # rate_limit_per_minute defaults to 200 when omitted.
#   { id = "submit", key = { env = "RAIKO2_SUBMIT_API_KEY" }, allow = ["prover.submit"], rate_limit_per_minute = 600 },
# ]

[rpc]
# Explicitly allowed (network, l1_network) combinations for the hoodi-compatible API.
# Canonical configs should declare RPC endpoints here.
pairs = [
  { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", beacon_rpc = "https://ethereum-hoodi-beacon-api.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", l2_provider = "geth_local_witness" },
  # Optional: set beacon_rpc to override the L1 beacon endpoint used for Shasta blobs.
  # Its path prefix is preserved; query parameters and fragments on the base URL are not.
  # The endpoint must support /eth/v1/beacon/blobs/{slot};
  # the deprecated blob_sidecars route is not used. Prysm must be v7.1.8 or later.
  # When omitted, raiko2 uses the built-in beacon RPC from the resolved L1 chain spec.
  # Optional: route witness/debug traffic to a dedicated L2 endpoint.
  # l2_provider defaults to "reth". Set l2_provider = "geth" for geth native debug_executionWitness.
  # Set l2_provider = "geth_local_witness" for a regular geth endpoint with locally assembled witnesses.
  # { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", l2_provider = "geth", l2_witness_rpc = "https://rpc.hoodi.taiko.xyz" },
  # Optional: enable hosted SP1 network verification for a specific pair.
  # sp1_verifier_address is the Succinct SP1 PLONK gateway on L1, not the Taiko Shasta verifier.
  # Leave these fields unset to keep that line closed.
  # { network = "taiko_mainnet", l1_network = "ethereum", l1_rpc = "https://ethereum-rpc.publicnode.com", l2_rpc = "https://rpc.mainnet.taiko.xyz", l2_witness_rpc = "https://rpc.mainnet.taiko.xyz", sp1_verifier_rpc_url = "https://ethereum-rpc.publicnode.com", sp1_verifier_address = "0x3B6041173B80E77f038f3F2C0f9744f04837185e" },
]

[rpc.client]
timeout_ms = 600000
concurrency_limit = 32

[rpc.client.retry]
max_attempts = 4
initial_backoff_ms = 1000
compute_units_per_second = 1000

[runtime]
environment = "development"
namespace = "raiko2-development"
# Terminal task metadata is retained for six hours by default. Artifact cleanup is ownership-driven.
terminal_task_ttl_secs = 21600
# Root, artifact, pending-publication, and overdue-active retention is paced independently from
# queue maintenance. Seven-day orphan management keeps a separate fixed batch bound.
cleanup_interval_secs = 30
cleanup_batch_size = 64
# Shared canonical preflight caching is enabled by default. Set this to "off" only as an
# incident-response bypass; it disables both persistent cache access and local singleflight.
preflight_cache = "shared"
# Optional active-cache invalidation before recovery or serving begins.
# Guest, image, or verifier upgrades normally need only "proof". Add "preflight" when derivation,
# fork, or witness-generation rules changed. Proof content remains for the bucket lifecycle TTL;
# canonical preflight cache objects are deleted directly.
# Cleanup repeats on every startup while configured; remove this setting after a successful cutover.
# startup_cleanup = ["proof"]
# startup_cleanup = ["proof", "preflight"]

[runtime.store]
# Memory is process-local and disposable. Use GCS for durable deployments.
backend = "memory"
# Set to true when intentionally using memory outside development, local, or test environments.
# allow_ephemeral = true
prefix = "raiko2/runtime/v1"
# bucket = "my-raiko2-runtime"

# Optional preflight cross-check against a second L2 RPC endpoint.
# Keys are L2 network names from rpc.pairs[*].network. Omit a network to skip verification.
# [preflight.verify_checkpoint_l2_rpcs]
# taiko_hoodi = "https://hoodi-l2-rpc.example.com"

[prover.risc0]
# RISC0 proving runs locally.
enabled = true
runner = "local"
snark = true
mock = false
# RISC0 execution segment limit.
execution_po2 = 20

[prover.sp1]
enabled = true
mode = "prove"
prover = "network"
recursion = "plonk"
verify = true
network_mode = "reserved"
fulfillment_strategy = "reserved"
skip_simulation = true
cycle_limit = 1000000000000
# Optional SP1 stage-specific cycle limits. If unset, `cycle_limit` is used.
# proposal_cycle_limit = 1000000000000
# aggregation_cycle_limit = 1000000000000
timeout_secs = 7200
# Operator-owned ceiling; request-scoped overrides may lower but never raise this value.
network_request_max_attempts = 3
# rpc_url = "https://rpc.production.succinct.xyz"

[prover.native]
enabled = true

[prover.sgx]
enabled = true
# Point this at the dedicated SGX runtime (`raiko2-sgx-prover`). That runtime may run in
# `tee` or `native` mode.
base_url = "http://127.0.0.1:8081"
timeout_ms = 300000

[prover.sgxgeth]
enabled = true
# Point this at the external geth-backed remote SGX server.
base_url = "http://127.0.0.1:8090"
timeout_ms = 300000

# Optional request sampling policy for proof_type=zk_any.
# When disabled or not drawn, the server returns data.status = "zk_any_not_drawn"
# and does not register a task.
#
# [prover.zk_any.sp1]
# probability = 0.05
# per_day = 8
#
# [prover.zk_any.risc0]
# probability = 0.05
# per_day = 8

[queue]
workers = 6
maintenance_interval_ms = 200
