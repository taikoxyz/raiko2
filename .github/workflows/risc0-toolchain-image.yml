name: build-risc0-toolchain-image

on:
  push:
    branches:
      - main
    paths:
      - docker/risc0-toolchain/**
      - .github/workflows/risc0-toolchain-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Set to true to force a rebuild"
        required: true
        default: "false"

# Default to read-only at the workflow level; only the build job needs to push
# to GHCR.
permissions:
  contents: read

concurrency:
  group: risc0-toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/risc0-toolchain/**'
              - '.github/workflows/risc0-toolchain-image.yml'

  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Keep in sync with docker/risc0-toolchain/Dockerfile.
      RISC0_GUEST_BUILDER_TAG: "r0.1.91.1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/risc0-toolchain
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: docker/risc0-toolchain
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=risc0-toolchain
          cache-to: type=gha,mode=max,scope=risc0-toolchain
          provenance: true
          sbom: true
          build-args: |
            RISC0_GUEST_BUILDER_TAG=${{ env.RISC0_GUEST_BUILDER_TAG }}
