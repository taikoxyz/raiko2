name: cuda-image

# Builds the NVIDIA GPU runtime image (Dockerfile.cuda) without pushing, so the `cuda` feature
# (RISC0 CUDA kernels via nvcc, SP1 sp1-gpu-server wiring) keeps compiling on GPU-less runners.
# Publishing stays on the canonical path: `just release-image-cuda <backend> <tag>`.

on:
  pull_request:
    paths:
      - 'Dockerfile.cuda'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/prover/**'
      - 'bin/raiko2/**'
      - '.github/workflows/cuda-image.yml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.cuda'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/prover/**'
      - 'bin/raiko2/**'
      - '.github/workflows/cuda-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CUDA devel base image plus a release build of raiko2 needs more disk than the
      # hosted runner leaves free by default.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: build CUDA runtime image
        env:
          VCS_REF: ${{ github.sha }}
        run: |
          docker buildx build \
            --file Dockerfile.cuda \
            --build-arg "VCS_REF=${VCS_REF}" \
            --tag raiko2-cuda:ci \
            --load \
            .

      - name: inspect image
        run: |
          docker run --rm --entrypoint /root/.sp1/bin/sp1-gpu-server raiko2-cuda:ci --version
          # raiko2 itself links libcuda.so.1, which only the host driver provides (`--gpus all`),
          # so it cannot start on this GPU-less runner; list its shared-library needs instead.
          docker run --rm --entrypoint sh raiko2-cuda:ci -c 'ls "$RISC0_HOME/extensions" && ldd /usr/local/bin/raiko2'
