[package]
name = "raiko2-guest-sp1"
version = "0.1.0"
edition = "2021"

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "sp1-shasta-proposal"
path = "src/shasta_proposal.rs"

[[bin]]
name = "sp1-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[[bin]]
name = "sp1-opcode-lab"
path = "src/opcode_lab.rs"

[[bin]]
name = "sp1-precompile-lab"
path = "src/precompile_lab.rs"

[[bin]]
name = "sp1-revm-opcode-lab"
path = "src/revm_opcode_lab.rs"

[dependencies]
raiko2-guest-common = { path = "../../crates/guest-common", default-features = false }
raiko2-primitives = { path = "../../crates/primitives" }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
sp1-zkvm = { version = "=6.1.0", features = ["verify"] }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
alloy-primitives = { version = "=1.5.7", default-features = false }
bincode = "=1.3.3"
num-bigint = { version = "=0.4.6", default-features = false }
revm = { version = "=38.0.0", default-features = false }
revm-precompile = { version = "=34.0.0", default-features = false, features = ["bn"] }

[features]
default = []
bench = ["raiko2-guest-common/bench"]

[patch.crates-io]
sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
sha2-v0-10-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", package = "substrate-bn", tag = "patch-0.6.0-sp1-6.0.0-substrate-bn" }

# Track companion PR taikoxyz/alethia-reth#195 (alethia-reth 1.2.0 line) until it merges, then
# drop this and bump the base revs to the merge SHA. Mirrors guests/risc0/Cargo.toml so the SP1
# guest resolves the same precompile sources as the root workspace.
[patch."https://github.com/taikoxyz/alethia-reth"]
alethia-reth-block = { git = "https://github.com/jmadibekov/alethia-reth", rev = "5333f16b48d11cdf7abba3453e5bdd7893c05a60" }
alethia-reth-chainspec = { git = "https://github.com/jmadibekov/alethia-reth", rev = "5333f16b48d11cdf7abba3453e5bdd7893c05a60" }
alethia-reth-consensus = { git = "https://github.com/jmadibekov/alethia-reth", rev = "5333f16b48d11cdf7abba3453e5bdd7893c05a60" }
alethia-reth-evm = { git = "https://github.com/jmadibekov/alethia-reth", rev = "5333f16b48d11cdf7abba3453e5bdd7893c05a60" }
alethia-reth-primitives = { git = "https://github.com/jmadibekov/alethia-reth", rev = "5333f16b48d11cdf7abba3453e5bdd7893c05a60" }

[workspace]
