[server]
host = "0.0.0.0"
port = 8080

[rpc]
pairs = [
  { network = "taiko_mainnet", l1_network = "ethereum", l1_rpc = "http://host.docker.internal:8545", l2_rpc = "http://host.docker.internal:9545" },
]

[rpc.client]
timeout_ms = 10000
concurrency_limit = 32

[rpc.client.retry]
max_attempts = 3
initial_backoff_ms = 500
compute_units_per_second = 1000

[runtime]
environment = "development"
namespace = "raiko2-compose"

[runtime.store]
backend = "memory"

[prover.risc0]
enabled = false
runner = "local"
snark = true
mock = false
execution_po2 = 20

[prover.sp1]
enabled = false
mode = "prove"
prover = "local"
recursion = "plonk"
verify = true
network_mode = "reserved"
fulfillment_strategy = "reserved"
skip_simulation = true
cycle_limit = 1000000000000
timeout_secs = 7200
network_request_max_attempts = 3

[prover.native]
enabled = true

[prover.sgx]
enabled = true
base_url = "http://raiko2-sgx:8080"
timeout_ms = 300000

[prover.sgxgeth]
enabled = true
base_url = "http://gaiko2-sgxgeth:8080"
timeout_ms = 300000

[queue]
workers = 6
maintenance_interval_ms = 200
