[package]
name = "raiko2-guest-sp1"
version = "0.1.0"
edition = "2021"

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "sp1-shasta-proposal"
path = "src/shasta_proposal.rs"

[[bin]]
name = "sp1-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[[bin]]
name = "sp1-uzen-proposal"
path = "src/uzen_proposal.rs"

[[bin]]
name = "sp1-uzen-aggregation"
path = "src/uzen_aggregation.rs"

[dependencies]
raiko2-guest-common = { path = "../common", default-features = false }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
sp1-zkvm = { version = "6.0.2", features = ["verify"] }
sp1-curves = "6.0.2"
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
alloy-primitives = { version = "1.5.0", default-features = false }
c-kzg = { version = "2.1.5", default-features = false, features = ["eip-7594", "ethereum_kzg_settings"] }
bincode = "1.3.3"
num-bigint = { version = "0.4.6", default-features = false }
revm-precompile = { version = "=32.0.0", default-features = false }

[features]
default = []
bench = ["raiko2-guest-common/bench"]

[patch.crates-io]
sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
sha3-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
c-kzg = { git = "https://github.com/risc0/c-kzg-4844", tag = "v2.1.5-risczero.0" }

[workspace]
