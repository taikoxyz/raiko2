[workspace]
resolver = "2"
members = [
    "xtask",
    "xtask/build-guest",
    "crates/guest-common",
    "crates/pipeline",
    "crates/guests",
    "crates/primitives",
    "crates/stateless",
    "crates/provider",
    "crates/engine",
    "crates/runtime",
    "crates/prover",
    "crates/protocol",
    "crates/protocol-shasta",
    "crates/primitives-shasta",
    "crates/queue",
    "crates/sgx-runtime",
    "bin/raiko2",
    "bin/raiko2-sgx-prover",
    "bin/rpc-proxy",
    "bin/witness-check",
    "bin/guest-launcher",
    "bin/preflight",
]
exclude = [
    "guests/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
redundant_pub_crate = "warn"
missing_const_for_fn = "warn"

# Always optimize for performance
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

[workspace.dependencies]
# Raiko2 crates
raiko2-primitives = { path = "./crates/primitives" }
raiko2-guest-common = { path = "./crates/guest-common" }
raiko2-prover = { path = "./crates/prover" }
raiko2-pipeline = { path = "./crates/pipeline" }
raiko2-provider = { path = "./crates/provider" }
raiko2-engine = { path = "./crates/engine" }
raiko2-runtime = { path = "./crates/runtime" }
raiko2-stateless = { path = "./crates/stateless" }
raiko2-protocol = { path = "./crates/protocol" }
raiko2-protocol-shasta = { path = "./crates/protocol-shasta" }
raiko2-primitives-shasta = { path = "./crates/primitives-shasta" }
raiko2-queue = { path = "./crates/queue" }
raiko2-guests = { path = "./crates/guests" }
raiko2-sgx-runtime = { path = "./crates/sgx-runtime" }

# Taiko client protocol
taiko-client-protocol = { git = "https://github.com/taikoxyz/taiko-mono", package = "protocol", branch = "main", default-features = false }

# zkVM
risc0-zkvm = { version = "=3.0.5", features = ["prove"] }
sp1-sdk = { version = "=6.1.0", features = ["blocking", "network"] }

# Alethia reth (raiko2 integration branch)
alethia-reth-block = { git = "https://github.com/taikoxyz/alethia-reth", rev = "a6782fe948f86fdf9b13a2f3f5f1a89f00d1c9c9", default-features = false, features = [
    "prover",
    "serde",
] }
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", rev = "a6782fe948f86fdf9b13a2f3f5f1a89f00d1c9c9", default-features = false }
alethia-reth-consensus = { git = "https://github.com/taikoxyz/alethia-reth", rev = "a6782fe948f86fdf9b13a2f3f5f1a89f00d1c9c9", default-features = false, features = [
    "full",
] }
alethia-reth-primitives = { git = "https://github.com/taikoxyz/alethia-reth", rev = "a6782fe948f86fdf9b13a2f3f5f1a89f00d1c9c9", default-features = false }

# Reth (aligned with the current taiko-mono and alethia-reth compatibility surface)
reth = { git = "https://github.com/paradigmxyz/reth", package = "reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false, features = [
    "serde",
] }
reth-primitives = { git = "https://github.com/paradigmxyz/reth", package = "reth-ethereum-primitives", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-primitives-traits = { version = "0.3.0", default-features = false }
reth-engine-local = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-engine-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-errors = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-payload-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-revm = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f", default-features = false }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", rev = "27bfddeada3953edc22759080a3659ccea62ca1f" }

# Alloy
alloy-rlp = { version = "0.3.4", default-features = false }
alloy-primitives = { version = "1.5.0", default-features = false }
alloy-sol-types = { version = "1.5.0", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
alloy-eips = { version = "2.0", default-features = false }
alloy-evm = { version = "0.33.2", default-features = false }
alloy-genesis = { version = "2.0", default-features = false }
alloy-hardforks = "0.4.7"
alloy-consensus = { version = "2.0", default-features = false, features = [
    "serde",
    "serde-bincode-compat",
] }
alloy-rpc-types-engine = { version = "2.0", default-features = false }
alloy-network = { version = "2.0", default-features = false, features = [
    "k256",
] }
alloy-json-rpc = { version = "2.0", default-features = false }
alloy-rpc-types = { version = "2.0", default-features = false }
alloy-rpc-types-debug = "2.0"
alloy-rpc-types-eth = { version = "2.0", default-features = false }
alloy-rpc-client = { version = "2.0", default-features = false, features = [
    "reqwest",
] }
alloy-serde = { version = "2.0", default-features = false }
alloy-provider = { version = "2.0", default-features = false, features = [
    "reqwest",
] }
alloy-transport-http = { version = "2.0", default-features = false, features = [
    "reqwest",
] }
alloy-signer-local = { version = "1.8.3" }

# Async, server, http
axum = { version = "0.8.7", features = ["macros"] }
tower-http = { version = "0.6.8", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tokio = { version = "^1.23", features = ["full"] }
reqwest = { version = "0.12.26", features = ["json"] }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
auto_impl = "1"
op-alloy-flz = { version = "0.13.1", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.0" }
sha2 = { version = "0.10", default-features = false }
bincode = "1.3.3"
hex = { version = "0.4.3" }
base64 = "0.22.1"
flate2 = { version = "=1.1.8" }
secp256k1 = { version = "0.30", default-features = false, features = [
    "std",
    "recovery",
] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"
url = "2.5.0"
revm-database-interface = { version = "10.0.0", default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.13.4", features = ["process"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# rpc-proxy dependencies
actix-web = "4"
alloy = { version = "2.0", features = ["full", "serde"] }
alloy-chains = { version = "0.2.23", features = ["serde"] }
blst = "0.3"
itertools = "0.14"
revm = { version = "38.0.0", default-features = false }
risc0-ethereum-trie = { git = "https://github.com/risc0/risc0-ethereum.git", tag = "v3.0.1" }
risc0-ethereum-contracts-boundless = { package = "risc0-ethereum-contracts", version = "=3.0.1" }
boundless-market = { version = "=1.4.0" }

# kzg
c-kzg = { version = "2.1.7", default-features = false, features = [
    "ethereum_kzg_settings",
    "portable",
    "std",
] }
kzg-rs = { git = "https://github.com/taikoxyz/kzg-rs", rev = "cd9c40b38b82558baa92e4cc4da6e6e007d9d704", default-features = false }
