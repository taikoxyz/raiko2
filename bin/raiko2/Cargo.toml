[package]
name = "raiko2"
version.workspace = true
edition.workspace = true
description = "Raiko V2 - Taiko zkVM Prover Server"
authors = ["Taiko Labs"]
license.workspace = true
workspace = "../.."

[lints]
workspace = true

[[bin]]
name = "raiko2"
path = "src/main.rs"

[dependencies]
# Raiko2 crates
raiko2-primitives.workspace = true
raiko2-primitives-shasta.workspace = true
raiko2-protocol-shasta.workspace = true
raiko2-engine = { path = "../../crates/engine", default-features = false }
raiko2-pipeline.workspace = true
raiko2-provider.workspace = true
raiko2-prover = { path = "../../crates/prover", default-features = false }
raiko2-queue.workspace = true
raiko2-runtime.workspace = true

alloy.workspace = true
alloy-signer-local.workspace = true
alloy-primitives.workspace = true
alloy-trie.workspace = true
axum.workspace = true
reth-ethereum-primitives.workspace = true
tower-http.workspace = true
url.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
prometheus.workspace = true

anyhow.workspace = true
async-trait.workspace = true
bincode.workspace = true

# Utilities
dotenvy = "0.15"

[features]
default = ["local-provers"]
local-provers = [
    "raiko2-engine/local-provers",
    "raiko2-prover/risc0",
    "raiko2-prover/sp1",
    "raiko2-prover/boundless",
]
remote-sgx-host = []
fixture-server = ["local-provers"]
redis-queue = ["raiko2-queue/redis"]

[dev-dependencies]
tower.workspace = true
http-body-util = "0.1"
