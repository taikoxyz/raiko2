[package]
name = "raiko2-guest-risc0"
version = "0.1.0"
edition = "2021"

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "risc0-proposal"
path = "src/proposal.rs"

[[bin]]
name = "risc0-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[dependencies]
raiko2-guest-common = { path = "../common" }
raiko2-primitives = { path = "../../crates/primitives" }
raiko2-protocol = { path = "../../crates/protocol" }
risc0-zkvm = { version = "3.0.4", default-features = false, features = ["std", "getrandom"] }
alloy-primitives = { version = "1.5.0", default-features = false }
bincode = "1.3.3"

[features]
default = []

[patch.crates-io]
c-kzg = { git = "https://github.com/brechtpd/c-kzg-4844", branch = "for-alpha7" }
blst = { git = "https://github.com/CeciliaZ030/blst.git", branch = "v0.3.12-serialize" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.2-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.6-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }

[workspace]
