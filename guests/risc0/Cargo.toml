[package]
name = "raiko2-guest-risc0"
version = "0.1.0"
edition = "2021"

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "risc0-shasta-proposal"
path = "src/shasta_proposal.rs"

[[bin]]
name = "risc0-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[dependencies]
raiko2-guest-common = { path = "../../crates/guest-common", default-features = false }
raiko2-primitives = { path = "../../crates/primitives", default-features = false }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = [
    "std",
    "getrandom",
    "disable-dev-mode",
] }
risc0-zkvm-platform = { version = "=2.2.2", default-features = false, features = ["sys-getenv"] }
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["tiny-keccak"] }
bincode = "=1.3.3"
num-bigint = { version = "=0.4.6", default-features = false }
# bn: BN254 via patched substrate-bn.
# blst: EVM BLS12-381 (EIP-2537 contiguous 0x0b..=0x11) + EVM 0x0a KZG (revm selects
#       blst::verify_kzg_proof when `blst` is on and `c-kzg` is off) via official risc0/blst.
# portable: required for blst on rv32im (no host ADX/SIMD).
# Do NOT enable revm-precompile's `c-kzg` feature. Blob PoE uses kzg-rs (accelerated by the
# bls12_381 crates-io patch below). Cargo.lock may still list optional `c-kzg` under
# revm-precompile — that is not the same as linking it. Check with
# `cargo tree -p raiko2-guest-risc0 -i c-kzg`.
revm-precompile = { version = "=34.0.0", default-features = false, features = [
    "bn",
    "blst",
    "portable",
] }
risc0-crypto-evm = "=0.1.0-rc.1"
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[features]
default = []
bench = ["raiko2-guest-common/bench"]

[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak.git", tag = "tiny-keccak/v2.0.2-risczero.0" }
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
# Accelerate kzg-rs (and any other bls12_381 consumers) with the official RISC0 patch.
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
# C BLS backend for revm-precompile EIP-2537. Compiles via the guest docker CC
# (CC_riscv32im_risc0_zkvm_elf) and is cached by the build-guest sccache volume
# (DOCKER_SCCACHE_CACHE=volume → raiko2-sccache-risc0). Prefer portable builds.
# Tag tracks the blst version pulled by revm-precompile/alloy (0.3.15–0.3.16).
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
[workspace]
