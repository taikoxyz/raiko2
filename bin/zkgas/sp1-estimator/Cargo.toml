[package]
name = "zkgas-sp1-estimator"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# This execute-only measurement policy is intentionally independent of the host SDK.
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sp1-sdk = { version = "=6.3.0", default-features = false }
sp1-core-executor = "=6.3.0"
sp1-core-executor-runner = "=6.3.0"

[dev-dependencies]
bincode = "1.3.3"
tempfile = "3"
