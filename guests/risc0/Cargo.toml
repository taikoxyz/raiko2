[package]
name = "raiko2-guest-risc0"
version = "0.1.0"
edition = "2021"

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "risc0-shasta-proposal"
path = "src/shasta_proposal.rs"

[[bin]]
name = "risc0-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[[bin]]
name = "risc0-shasta-boundless-aggregation"
path = "src/boundless_aggregation.rs"

[dependencies]
raiko2-guest-common = { path = "../common", default-features = false }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
risc0-zkvm = { version = "=3.0.3", default-features = false, features = [
    "std",
    "getrandom",
] }
risc0-zkvm-platform = { version = "2.2.1", default-features = false, features = ["sys-getenv"] }
alloy-primitives = { version = "1.5.0", default-features = false, features = ["tiny-keccak"] }
bincode = "1.3.3"
revm-precompile = { version = "=32.1.0", default-features = false }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[features]
default = []
bench = ["raiko2-guest-common/bench"]

[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak.git", tag = "tiny-keccak/v2.0.2-risczero.0" }
[workspace]
