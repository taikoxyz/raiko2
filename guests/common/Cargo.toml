[package]
name = "raiko2-guest-common"
version = "0.1.0"
edition = "2021"

[dependencies]
raiko2-primitives = { path = "../../crates/primitives" }
raiko2-primitives-shasta = { path = "../../crates/primitives-shasta" }
raiko2-protocol = { path = "../../crates/protocol" }
raiko2-protocol-shasta = { path = "../../crates/protocol-shasta" }
raiko2-stateless = { path = "../../crates/stateless" }
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", rev = "3b8eacb21e60079f4110dc2334c3ce91e12489d5", default-features = false }
alethia-reth-block = { git = "https://github.com/taikoxyz/alethia-reth", rev = "3b8eacb21e60079f4110dc2334c3ce91e12489d5", default-features = false, features = [
    "prover",
    "serde",
] }
alethia-reth-primitives = { git = "https://github.com/taikoxyz/alethia-reth", rev = "3b8eacb21e60079f4110dc2334c3ce91e12489d5", default-features = false }
alloy-primitives = { version = "1.5.0", default-features = false }
alloy-consensus = { version = "1.0", default-features = false, features = ["serde"] }
alloy-sol-types = { version = "1.5.0", default-features = false }
alloy-rlp = { version = "0.3.4", default-features = false }
alloy-hardforks = "0.4.7"
anyhow = "1.0"
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.0.0", features = [
    "serde",
] }

[dev-dependencies]
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.0.0" }

[features]
default = []
bench = []

[workspace]
