[package]
name = "raiko2"
version.workspace = true
edition.workspace = true
description = "Raiko V2 - Taiko zkVM Prover Server"
authors = ["Taiko Labs"]
license.workspace = true
workspace = "../.."

[lints]
workspace = true

[[bin]]
name = "raiko2"
path = "src/main.rs"

[dependencies]
# Raiko2 crates
raiko2-primitives.workspace = true
raiko2-engine.workspace = true
raiko2-pipeline.workspace = true
raiko2-provider.workspace = true
raiko2-prover.workspace = true
raiko2-queue.workspace = true

alloy.workspace = true
axum.workspace = true
tower-http.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

anyhow.workspace = true

# Utilities
dotenvy = "0.15"

[features]
default = ["zkvm"]
zkvm = ["raiko2-prover/zkvm"]
redis-queue = ["raiko2-queue/redis"]
tdx = ["raiko2-prover/tdx"]

[dev-dependencies]
tower.workspace = true
http-body-util = "0.1"
async-trait.workspace = true
raiko2-primitives-shasta.workspace = true
reth-ethereum-primitives.workspace = true
reth-stateless.workspace = true
alloy-primitives.workspace = true
alloy-trie.workspace = true
