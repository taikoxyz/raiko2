name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - '!crates/guests/elf/**'
              - 'bin/**'
              - 'guests/**'
              - 'xtask/**'
              - 'config/**'
              - 'test.json'
              - 'justfile'
            workflow:
              - '.github/workflows/ci.yml'

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"
          components: clippy

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      # Keep the main clippy lane on fast foundational crates plus preflight. The heavier
      # prover/engine/server stack is covered by the manually dispatched rust-heavy workflow.
      - name: clippy
        run: >
          cargo clippy
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta
          -p raiko2-guests
          -p raiko2-provider
          -p raiko2-pipeline
          -p raiko2-queue
          -p raiko2-runtime
          -p raiko2-stateless
          -p preflight
          --
          -D warnings

  rust-test-foundation:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      # Split test lanes by dependency weight to stay under runner disk limits.
      - name: test foundation
        run: >
          cargo test
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta

  rust-test-pipeline:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      # build-guest-{risc0,sp1} already exercise xtask's guest build path.
      # Keep default Rust test lanes off xtask because that package drags both zk stacks
      # into cold-start test compiles.
      - name: test pipeline
        run: >
          cargo test
          -p raiko2-provider
          -p raiko2-pipeline
          -p preflight

  rust-test-runtime:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-rust

      - name: test runtime
        run: >
          cargo test
          -p raiko2-queue
          -p raiko2-runtime

  # Keep the prover/engine/server stack out of the default PR gate for now; those heavier lanes
  # are covered by the manually dispatched rust-heavy workflow.
  rust:
    needs:
      - changes
      - rust-fmt
      - rust-clippy
      - rust-test-foundation
      - rust-test-pipeline
      - rust-test-runtime
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: verify rust lanes
        env:
          FMT_RESULT: ${{ needs.rust-fmt.result }}
          CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          TEST_FOUNDATION_RESULT: ${{ needs.rust-test-foundation.result }}
          TEST_PIPELINE_RESULT: ${{ needs.rust-test-pipeline.result }}
          TEST_RUNTIME_RESULT: ${{ needs.rust-test-runtime.result }}
        run: |
          test "${FMT_RESULT}" = "success"
          test "${CLIPPY_RESULT}" = "success"
          test "${TEST_FOUNDATION_RESULT}" = "success"
          test "${TEST_PIPELINE_RESULT}" = "success"
          test "${TEST_RUNTIME_RESULT}" = "success"

  # Stable required check: always rebuild checked-in guest ELFs on the self-hosted runner.
  # This job is the main guest build gate; no separate build-guest-* jobs remain in ci.yml.
  # If this detects drift, authors should repair the branch with the manual sync-guest-elf workflow.
  guest-elf-consistency:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, raiko2]
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      RISC0_TOOLCHAIN_IMAGE: raiko2-risc0-toolchain:local
      SP1_TOOLCHAIN_IMAGE: raiko2-sp1-toolchain:local
    steps:
      # Self-hosted runner workaround for actions/checkout#2008: when a
      # previous job leaves stale files in the workspace without a `.git`
      # directory, checkout's "Removing auth" step fails with
      # `fatal: --local can only be used inside a git repository`.
      # Wiping the workspace first forces the clean-clone path.
      #
      # The previous run of this job built risc0/sp1 guests inside Docker
      # containers running as root, so some files under `target/` end up
      # owned by uid 0 and the unprivileged runner user cannot remove
      # them. Try sudo first, fall back to a throwaway root container, and
      # finally a best-effort plain rm so we still make progress on a
      # cold runner with no Docker.
      - name: ensure clean self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "${GITHUB_WORKSPACE}" ]; then
            exit 0
          fi
          cd /tmp
          if sudo -n true 2>/dev/null; then
            sudo find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm --user 0:0 \
              -v "${GITHUB_WORKSPACE}":/ws \
              alpine:3 \
              sh -c 'find /ws -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          else
            find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: ci-zk-build

      - uses: taiki-e/install-action@3f9f98517dede275478bf30d33e779b37701c7fa # just
        with:
          tool: just

      - name: rebuild guest elfs
        run: |
          just build-guest risc0
          just build-guest sp1

      - name: export guest digests
        run: cargo run -p xtask-build-guest --bin guest-digests -- --output target/guest-digests/summary.json

      - name: upload guest digest summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-digests
          path: target/guest-digests/summary.json
          retention-days: 7

      - name: publish guest digest summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.load(open("target/guest-digests/summary.json"))
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "## Guest Digests",
              "",
              f"Commit: `{os.environ['GITHUB_SHA']}`",
              f"Guest ELF dir: `{summary['guest_elf_dir']}`",
              "",
              "| Proof System | Object | Stage | Source | Digest |",
              "| --- | --- | --- | --- | --- |",
          ]
          for entry in summary["digests"]:
              lines.append(
                  "| `{proof_system}` | `{object_name}` | `{stage}` | `{digest_source}` | `{digest}` |".format(
                      **entry
                  )
              )
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: verify guest elf consistency
        shell: bash
        run: |
          set -euo pipefail
          status_output="$(git status --porcelain --untracked-files=all -- crates/guests/elf)"
          if [ -n "${status_output}" ]; then
            printf '%s\n' "${status_output}"
            git diff --stat -- crates/guests/elf
            echo "::error title=Guest ELF drift detected::Checked-in guest ELFs differ from a clean rebuild. Run the sync-guest-elf workflow for this branch and commit the resulting ELF update."
            exit 1
          fi

  # TODO: add a native smoke lane here once the repo has a deterministic CI-safe
  # fixture/regression entrypoint for native proving.
