[package]
name = "raiko2-guest-sp1"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# Shasta-only binary targets for Raiko V2
[[bin]]
name = "sp1-proposal"
path = "src/proposal.rs"

[[bin]]
name = "sp1-shasta-aggregation"
path = "src/shasta_aggregation.rs"

[dependencies]
raiko2-primitives = { workspace = true }
raiko2-protocol = { workspace = true }
raiko2-stateless = { workspace = true }
reth-chainspec = { workspace = true }
reth-evm-ethereum = { workspace = true }
sp1-zkvm = { version = "5.2.3", features = ["verify"] }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-4.0.0" }
alloy-primitives.workspace = true
bincode.workspace = true

[features]
default = []
