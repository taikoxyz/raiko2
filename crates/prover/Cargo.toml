[package]
name = "raiko2-prover"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace dependencies
raiko2-guest-common.workspace = true
raiko2-primitives.workspace = true
raiko2-primitives-shasta.workspace = true
raiko2-protocol-shasta.workspace = true
raiko2-pipeline.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bincode.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tokio.workspace = true
hex.workspace = true
url.workspace = true

# Alloy types
alloy.workspace = true
alloy-primitives.workspace = true
alloy-signer-local.workspace = true
alloy-consensus.workspace = true
reth-ethereum-primitives.workspace = true
serde_with.workspace = true

# RISC0 dependencies (optional)
risc0-zkvm = { workspace = true, optional = true }
risc0-ethereum-contracts-boundless = { workspace = true, optional = true }
boundless-market = { workspace = true, optional = true }

# SP1 dependencies (optional)
sp1-sdk = { workspace = true, optional = true }

[features]
default = ["risc0", "sp1", "boundless"]
risc0 = ["dep:risc0-zkvm", "dep:risc0-ethereum-contracts-boundless"]
sp1 = ["dep:sp1-sdk"]
boundless = ["risc0", "dep:boundless-market"]


[dev-dependencies]
httpmock = "0.7"
alloy-sol-types.workspace = true
alloy-consensus.workspace = true
reth-ethereum-primitives.workspace = true
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "2.2.2"
raiko2-guests.workspace = true
