name: rust-heavy

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Heavy Rust lane to run
        required: true
        default: all
        type: choice
        options:
          - prover
          - engine
          - server
          - all
      ref:
        description: Branch to test; defaults to the branch this workflow was dispatched from
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-heavy-${{ github.event.inputs.ref || github.ref }}-${{ github.event.inputs.lane || 'all' }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
    env:
      TARGET_REF_INPUT: ${{ inputs.ref }}
      DISPATCH_REF: ${{ github.ref_name }}
    steps:
      - name: resolve target ref
        id: target
        shell: bash
        run: |
          set -eu
          target_ref="$(printf '%s' "${TARGET_REF_INPUT}" | xargs)"
          if [ -z "${target_ref}" ]; then
            target_ref="${DISPATCH_REF}"
          fi
          echo "ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved target ref: ${target_ref}"

  test-prover:
    needs: resolve-ref
    if: inputs.lane == 'prover' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: print resolved revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: check prover smoke
        run: cargo check -p raiko2-prover -p guest-launcher --tests

  test-engine:
    needs: resolve-ref
    if: inputs.lane == 'engine' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: print resolved revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: check engine smoke
        run: cargo check -p raiko2-engine --tests

  test-server:
    needs: resolve-ref
    if: inputs.lane == 'server' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.95.0"

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: print resolved revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: check server smoke
        run: cargo check -p raiko2 --tests
