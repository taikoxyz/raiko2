name: sync-guest-elf

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Guest backend to rebuild
        required: true
        default: all
        type: choice
        options:
          - risc0
          - sp1
          - all
      ref:
        description: Branch to update; defaults to the branch this workflow was dispatched from
        required: false
        type: string

# Default to read-only at the workflow level. Only the dedicated `push` job
# below upgrades to `contents: write`, and that job never executes any code
# from the user-selected branch.
permissions:
  contents: read

concurrency:
  group: sync-guest-elf-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Build job: runs the user-selected branch's `just build-guest` recipe on
  # the self-hosted runner. Holds NO write credentials so that compromised
  # or malicious branch code cannot push back to the repository even if it
  # escapes the build sandbox.
  build:
    name: build guest elfs
    runs-on: [self-hosted, linux, x64, raiko2]
    permissions:
      contents: read
    outputs:
      target_ref: ${{ steps.target.outputs.ref }}
      backend: ${{ steps.backend.outputs.value }}
      built_sha: ${{ steps.built-sha.outputs.sha }}
    env:
      CARGO_TERM_COLOR: always
      TARGET_REF_INPUT: ${{ inputs.ref }}
      DISPATCH_REF: ${{ github.ref_name }}
      BACKEND_INPUT: ${{ inputs.backend }}
    steps:
      - name: resolve and validate target ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions parses every stdout/stderr line for workflow
          # commands (`::error::...`, `::set-output...`, etc.). Echoing raw
          # user input into one of those commands lets a dispatcher with
          # `%0A` (newline) in their input inject extra commands. Escape
          # `%`, `\r`, `\n` per GitHub's command-value escaping rules
          # before printing anything user-controlled.
          gha_escape() {
            local v="$1"
            v="${v//%/%25}"
            v="${v//$'\r'/%0D}"
            v="${v//$'\n'/%0A}"
            printf '%s' "$v"
          }
          # Trim only leading/trailing whitespace - any interior whitespace
          # is invalid for a branch name and must be rejected loudly below
          # rather than silently collapsed.
          target_ref="${TARGET_REF_INPUT}"
          target_ref="${target_ref#"${target_ref%%[![:space:]]*}"}"
          target_ref="${target_ref%"${target_ref##*[![:space:]]}"}"
          if [ -z "${target_ref}" ]; then
            target_ref="${DISPATCH_REF}"
          fi
          # Reject fully-qualified refs, remote-tracking refs, and special
          # tokens. Without this, `refs/heads/main` would pass validation
          # but the push step's `refs/heads/<ref>` refspec would resolve to
          # `refs/heads/refs/heads/main`, silently pushing to the wrong
          # branch.
          case "${target_ref}" in
            refs/*|origin/*|upstream/*|HEAD|@*)
              echo "::error title=Invalid ref::Use a short branch name (e.g. 'main', 'feature/foo'), not '$(gha_escape "${target_ref}")'"
              exit 1
              ;;
          esac
          # Allowlist character class. git check-ref-format already rejects
          # spaces, '..', '~', '^', ':', '?', '*', '[', '\\', control chars,
          # and leading '-', but we double-gate against anything outside
          # [A-Za-z0-9._/-] to keep the push refspec unambiguous. This is
          # intentionally stricter than git's own check; if you need a new
          # character class in a branch name, extend it here on purpose.
          case "${target_ref}" in
            *[!A-Za-z0-9._/-]*)
              echo "::error title=Invalid ref::Branch name contains disallowed characters: '$(gha_escape "${target_ref}")'"
              exit 1
              ;;
          esac
          if ! git check-ref-format --branch "${target_ref}" >/dev/null 2>&1; then
            echo "::error title=Invalid ref::Refusing to operate on malformed branch name: '$(gha_escape "${target_ref}")'"
            exit 1
          fi
          echo "ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved target ref: ${target_ref}"

      - name: validate backend input
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          gha_escape() {
            local v="$1"
            v="${v//%/%25}"
            v="${v//$'\r'/%0D}"
            v="${v//$'\n'/%0A}"
            printf '%s' "$v"
          }
          case "${BACKEND_INPUT}" in
            risc0|sp1|all) ;;
            *)
              echo "::error title=Invalid backend::backend must be one of risc0|sp1|all (got: '$(gha_escape "${BACKEND_INPUT}")')"
              exit 1
              ;;
          esac
          echo "value=${BACKEND_INPUT}" >> "${GITHUB_OUTPUT}"

      # Self-hosted runner workaround for actions/checkout#2008: when a
      # previous job leaves stale files in the workspace without a `.git`
      # directory, checkout's "Removing auth" step fails with
      # `fatal: --local can only be used inside a git repository`.
      # Wiping the workspace first forces the clean-clone path.
      #
      # Files left by the guest-build Docker containers are owned by
      # uid 0, so try sudo first, fall back to a throwaway root
      # container, and finally a best-effort plain rm.
      - name: ensure clean self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "${GITHUB_WORKSPACE}" ]; then
            exit 0
          fi
          cd /tmp
          if sudo -n true 2>/dev/null; then
            sudo find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm --user 0:0 \
              -v "${GITHUB_WORKSPACE}":/ws \
              alpine:3 \
              sh -c 'find /ws -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          else
            find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Force-resolve as a branch ref. If the input is a tag or raw
          # SHA, `refs/heads/<value>` does not exist on the remote and
          # actions/checkout fails fast, instead of silently checking out
          # a non-branch ref that the push step would later resurrect as
          # a brand-new branch via `refs/heads/<value>`.
          ref: refs/heads/${{ steps.target.outputs.ref }}
          fetch-depth: 0
          # Build job is read-only; no token must survive into branch-
          # controlled steps like `just build-guest`.
          persist-credentials: false

      - name: capture built commit sha
        id: built-sha
        shell: bash
        run: |
          set -euo pipefail
          # Pin the build to an exact commit. The push job will commit on
          # top of this SHA and use --force-with-lease scoped to BUILT_SHA
          # so the push fails loudly if the branch advanced OR was
          # deleted/recreated during the build.
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Build pinned to ${sha}"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: sync-guest-elf

      - uses: taiki-e/install-action@3f9f98517dede275478bf30d33e779b37701c7fa # just
        with:
          tool: just

      - name: clear backend-owned guest elfs before rebuild
        shell: bash
        env:
          BACKEND: ${{ steps.backend.outputs.value }}
        run: |
          set -euo pipefail
          # Drop every ELF this run is responsible for BEFORE running the
          # build. This guarantees the upload artifact contains exactly
          # what `just build-guest` produced - never a stale ELF left
          # behind from a prior run whose corresponding guest [[bin]] has
          # since been renamed or removed in source. ELFs owned by the
          # other backend stay intact so they survive the artifact round
          # trip into the push job.
          #
          # `rm -rf` (driven by a shell glob) removes regular files,
          # symlinks, and empty directories alike - find -type f would
          # leave a branch-supplied symlink (or a directory masquerading
          # as an .elf) in place to disrupt later steps.
          mkdir -p crates/guests/elf
          shopt -s nullglob
          case "${BACKEND}" in
            risc0) entries=(crates/guests/elf/risc0_*.elf) ;;
            sp1)   entries=(crates/guests/elf/sp1_*.elf crates/guests/elf/sp1_*.vk.bin) ;;
            all)   entries=(crates/guests/elf/*.elf crates/guests/elf/*.vk.bin) ;;
          esac
          if [ "${#entries[@]}" -gt 0 ]; then
            rm -rf -- "${entries[@]}"
          fi

      - name: build guest elfs
        shell: bash
        env:
          BACKEND: ${{ steps.backend.outputs.value }}
        run: |
          set -euo pipefail
          just build-guest "${BACKEND}"

      - name: verify build produced expected elfs
        shell: bash
        env:
          BACKEND: ${{ steps.backend.outputs.value }}
        run: |
          set -euo pipefail
          # Guard against the build silently producing nothing - without
          # this, the workflow would happily upload an empty artifact and
          # the push job would commit a wholesale deletion of every
          # backend-owned ELF.
          shopt -s nullglob
          case "${BACKEND}" in
            risc0) produced=(crates/guests/elf/risc0_*.elf) ;;
            sp1)   produced=(crates/guests/elf/sp1_*.elf crates/guests/elf/sp1_*.vk.bin) ;;
            all)   produced=(crates/guests/elf/*.elf crates/guests/elf/*.vk.bin) ;;
          esac
          if [ "${#produced[@]}" -eq 0 ]; then
            echo "::error title=Empty build::no ELFs produced for backend=${BACKEND}"
            exit 1
          fi
          echo "Build produced ${#produced[@]} ELF(s) for backend=${BACKEND}"

      - name: upload guest elf outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-elf-sync-${{ steps.backend.outputs.value }}
          path: |
            crates/guests/elf/*.elf
            crates/guests/elf/*.vk.bin
          if-no-files-found: error
          retention-days: 7

  # Push job: minimal surface area. Runs on a clean GitHub-hosted runner,
  # downloads the artifact from the build job, and only executes git
  # plumbing (add/commit/push). It never invokes `just`, `cargo`, or any
  # other code from the target branch, so the `contents: write` permission
  # cannot be hijacked by branch-controlled scripts.
  push:
    name: commit and push guest elfs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_REF: ${{ needs.build.outputs.target_ref }}
      BACKEND: ${{ needs.build.outputs.backend }}
      BUILT_SHA: ${{ needs.build.outputs.built_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Check out the exact commit the build was pinned to, NOT the
          # mutable branch tip. The push at the end uses
          # --force-with-lease scoped to BUILT_SHA so we cannot silently
          # overlay stale ELFs onto a branch that advanced (or was
          # deleted/recreated) while the guest build was running.
          ref: ${{ needs.build.outputs.built_sha }}
          fetch-depth: 0
          # Persist credentials so `git push` works. This job runs only git
          # plumbing on a clean runner, never repo-supplied scripts.
          persist-credentials: true

      - name: disarm clean/smudge filters and working-tree hooks
        shell: bash
        run: |
          set -euo pipefail
          # In-tree `.gitattributes` is always honored by `git add` - we
          # cannot turn that off via config. The actual safety guarantee
          # is that ubuntu-latest's git installation has no
          # `filter.<name>.clean` / `.smudge` / `.process` configured, so
          # a branch-supplied attribute like `*.elf filter=lfs` is inert.
          # As defense in depth, strip any filter sections that may have
          # been added by the runner image (e.g. if LFS ever ships
          # pre-configured) so attribute matches still cannot invoke
          # arbitrary processes during `git add`.
          while IFS= read -r section; do
            git config --global --remove-section "${section}" 2>/dev/null || true
          done < <(
            git config --global --list --name-only 2>/dev/null \
              | grep -E '^filter\.' \
              | sed -E 's/\.[^.]+$//' \
              | sort -u
          )
          # Point core.hooksPath at an empty directory so anything a
          # branch shipped under `hooks/` cannot fire. (Hooks live in
          # `.git/hooks`, which is not checked out from the repo, but
          # this also covers branches that set core.hooksPath via
          # `.git/config` template tricks.)
          mkdir -p "${RUNNER_TEMP}/empty-hooks"
          git config core.hooksPath "${RUNNER_TEMP}/empty-hooks"

      - name: clear backend-owned elfs before artifact extraction
        shell: bash
        run: |
          set -euo pipefail
          # Drop only the ELFs this run owns. The artifact contains only
          # outputs for the requested backend, so anything matching the
          # other backend's prefix must be preserved from the target
          # branch's tip - otherwise a backend=risc0 sync would
          # accidentally delete every sp1 ELF (and vice versa).
          #
          # `rm -rf` over a shell glob catches symlinks and directories
          # disguised as `.elf` entries that a branch might have shipped;
          # `find -type f` would leave them behind.
          mkdir -p crates/guests/elf
          shopt -s nullglob
          case "${BACKEND}" in
            risc0) entries=(crates/guests/elf/risc0_*.elf) ;;
            sp1)   entries=(crates/guests/elf/sp1_*.elf crates/guests/elf/sp1_*.vk.bin) ;;
            all)   entries=(crates/guests/elf/*.elf crates/guests/elf/*.vk.bin) ;;
          esac
          if [ "${#entries[@]}" -gt 0 ]; then
            rm -rf -- "${entries[@]}"
          fi

      - name: download rebuilt guest elfs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guest-elf-sync-${{ needs.build.outputs.backend }}
          path: crates/guests/elf/

      - name: restore executable bit on rebuilt guest elfs
        shell: bash
        run: |
          set -euo pipefail
          # actions/upload-artifact normalizes file permissions, so the
          # downloaded ELFs come back as 0644. The repository tracks them
          # as 0755, so without this step the push job would commit a
          # permission-only regression that `guest-elf-consistency` would
          # immediately flag on the next CI run.
          shopt -s nullglob
          for elf in crates/guests/elf/*.elf; do
            chmod 0755 "${elf}"
          done

      - name: detect elf changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- crates/guests/elf)" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No ELF changes detected."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "ELF changes detected."
          fi

      - name: commit synced guest elfs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A captures additions, modifications, AND deletions/renames
          # within the ELF directory.
          git add -A -- crates/guests/elf
          git commit -m "chore: sync guest elf outputs (built from ${BUILT_SHA})"

      - name: push synced guest elfs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # --force-with-lease scoped to BUILT_SHA: the push succeeds iff
          # the remote ref `refs/heads/${TARGET_REF}` is currently at
          # BUILT_SHA. Three failure modes are blocked:
          #   1. Branch advanced during build  -> remote != BUILT_SHA
          #   2. Branch was deleted             -> remote does not exist
          #   3. Branch was deleted & recreated -> remote != BUILT_SHA
          # All three correctly fail loudly instead of silently
          # resurrecting the branch from stale ELFs. The new commit's
          # parent is BUILT_SHA, so when the lease passes the actual
          # update is a normal fast-forward.
          git push \
            --force-with-lease="refs/heads/${TARGET_REF}:${BUILT_SHA}" \
            origin "HEAD:refs/heads/${TARGET_REF}"
