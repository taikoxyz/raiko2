name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      zk: ${{ steps.filter.outputs.zk }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'bin/**'
              - 'guests/**'
              - 'xtask/**'
              - 'config/**'
              - 'test.json'
              - 'justfile'
            zk:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'guests/**'
              - 'xtask/**'
              - 'docker/**'
              - 'justfile'
            workflow:
              - '.github/workflows/ci.yml'

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: clippy

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      # Keep the main clippy lane on core library crates plus the primary server and preflight CLI.
      # Heavier auxiliary bins such as rpc-proxy, witness-check, and guest-launcher stay out of the
      # default lane until we decide how to cover them separately.
      - name: clippy
        run: >
          cargo clippy
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta
          -p raiko2-guests
          -p raiko2-provider
          -p raiko2-pipeline
          -p raiko2-prover
          -p raiko2-engine
          -p raiko2-queue
          -p raiko2-runtime
          -p raiko2-stateless
          -p raiko2
          -p preflight
          --
          -D warnings

  rust-nextest:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      - uses: taiki-e/install-action@nextest

      - name: nextest
        run: cargo nextest run --workspace

  rust:
    needs:
      - changes
      - rust-fmt
      - rust-clippy
      - rust-nextest
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: verify rust lanes
        run: |
          test "${{ needs.rust-fmt.result }}" = "success"
          test "${{ needs.rust-clippy.result }}" = "success"
          if [ "${{ needs.changes.outputs.rust }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ needs.rust-nextest.result }}" = "success"
          else
            test "${{ needs.rust-nextest.result }}" = "skipped"
          fi

  # Guest backend versions are pinned by repo-owned toolchain definitions:
  # - RISC0: docker/risc0-toolchain/Dockerfile
  # - SP1: guests/sp1/Cargo.lock + docker/sp1-toolchain/Dockerfile
  build-guest-risc0:
    needs: changes
    if: needs.changes.outputs.zk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RISC0_TOOLCHAIN_IMAGE: raiko2-risc0-toolchain:local
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-zk-build

      - uses: taiki-e/install-action@just

      - name: build guest risc0
        run: just build-guest risc0

      - name: verify guest elf outputs are up to date
        run: git diff --exit-code -- crates/guests/elf

  build-guest-sp1:
    needs: changes
    if: needs.changes.outputs.zk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SP1_TOOLCHAIN_IMAGE: raiko2-sp1-toolchain:local
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-zk-build

      - uses: taiki-e/install-action@just

      - name: build guest sp1
        run: just build-guest sp1

      - name: verify guest elf outputs are up to date
        run: git diff --exit-code -- crates/guests/elf

  # TODO: add a native smoke lane here once the repo has a deterministic CI-safe
  # fixture/regression entrypoint for native proving.
