name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      zk: ${{ steps.filter.outputs.zk }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - '!crates/guests/elf/**'
              - 'bin/**'
              - 'guests/**'
              - 'xtask/**'
              - 'config/**'
              - 'test.json'
              - 'justfile'
            zk:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - '!crates/guests/elf/**'
              - 'guests/**'
              - 'xtask/**'
              - 'docker/**'
              - 'justfile'
            workflow:
              - '.github/workflows/ci.yml'

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: clippy

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      # Keep the main clippy lane on core library crates plus preflight.
      # The prover/engine/server stack currently pulls boundless-market through raiko2-prover,
      # which is failing in CI due to upstream generated-contract issues, so those packages stay
      # out of the default lane until we decide how to cover them separately.
      - name: clippy
        run: >
          cargo clippy
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta
          -p raiko2-guests
          -p raiko2-provider
          -p raiko2-pipeline
          -p raiko2-queue
          -p raiko2-runtime
          -p raiko2-stateless
          -p preflight
          --
          -D warnings

  rust-test-foundation:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      # Split test lanes by dependency weight to stay under runner disk limits.
      - name: test foundation
        run: >
          cargo test
          -p raiko2-primitives
          -p raiko2-primitives-shasta
          -p raiko2-protocol
          -p raiko2-protocol-shasta

  rust-test-pipeline:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      # build-guest-{risc0,sp1} already exercise xtask's guest build path.
      # Keep default Rust test lanes off xtask because that package drags both zk stacks
      # into cold-start test compiles.
      - name: test pipeline
        run: >
          cargo test
          -p raiko2-provider
          -p raiko2-pipeline
          -p preflight

  rust-test-runtime:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -Cdebuginfo=0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      - name: test runtime
        run: >
          cargo test
          -p raiko2-queue
          -p raiko2-runtime

  # Keep the prover/engine/server stack out of the default PR gate for now.
  # Those packages pull boundless-market through raiko2-prover, and the published
  # boundless-market crate is currently failing in CI while generating/parsing its
  # contract bindings. Reintroduce these lanes once that upstream dependency is
  # pinned to a working source or otherwise covered separately.
  rust:
    needs:
      - changes
      - rust-fmt
      - rust-clippy
      - rust-test-foundation
      - rust-test-pipeline
      - rust-test-runtime
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: verify rust lanes
        run: |
          test "${{ needs.rust-fmt.result }}" = "success"
          test "${{ needs.rust-clippy.result }}" = "success"
          test "${{ needs.rust-test-foundation.result }}" = "success"
          test "${{ needs.rust-test-pipeline.result }}" = "success"
          test "${{ needs.rust-test-runtime.result }}" = "success"

  # Guest backend versions are pinned by repo-owned toolchain definitions:
  # - RISC0: docker/risc0-toolchain/Dockerfile
  # - SP1: guests/sp1/Cargo.lock + docker/sp1-toolchain/Dockerfile
  build-guest-risc0:
    needs: changes
    if: needs.changes.outputs.zk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RISC0_TOOLCHAIN_IMAGE: raiko2-risc0-toolchain:local
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-zk-build

      - uses: taiki-e/install-action@just

      - name: build guest risc0
        run: just build-guest risc0

      # Temporary: treat guest build as a compile/producibility check only.
      # The generated ELFs are uploaded for inspection instead of enforcing
      # byte-for-byte equality with the checked-in copies.
      - name: upload guest elf outputs
        uses: actions/upload-artifact@v4
        with:
          name: guest-elf-risc0
          path: crates/guests/elf/risc0_*.elf
          retention-days: 7

  build-guest-sp1:
    needs: changes
    if: needs.changes.outputs.zk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SP1_TOOLCHAIN_IMAGE: raiko2-sp1-toolchain:local
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-zk-build

      - uses: taiki-e/install-action@just

      - name: build guest sp1
        run: just build-guest sp1

      - name: upload guest elf outputs
        uses: actions/upload-artifact@v4
        with:
          name: guest-elf-sp1
          path: crates/guests/elf/sp1_*.elf
          retention-days: 7

  # TODO: add a native smoke lane here once the repo has a deterministic CI-safe
  # fixture/regression entrypoint for native proving.
