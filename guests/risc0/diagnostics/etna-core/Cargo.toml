[package]
name = "risc0-etna-core-diagnostic"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
etna-guest-compat-fixture = { path = "../../../../crates/etna-guest-compat", features = ["tiny-keccak"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = [
    "std",
    "getrandom",
    "disable-dev-mode",
] }
risc0-zkvm-platform = { version = "=2.2.2", default-features = false, features = ["sys-getenv"] }
