# Example configuration for the raiko2 prover server.
#
# Load with:
#   raiko2 --config ./config.toml
# or:
#   RAIKO2_CONFIG=./config.toml raiko2
#
# CLI flags and explicitly supported environment variables override values from this file.

[server]
host = "0.0.0.0"
port = 8080
# Optional: enables ACL-protected endpoints.
# V4 submit/task endpoints stay public unless a key allows "prover.submit" or "admin".
# ACL key id and key values must be unique.
# [server.acl]
# keys = [
#   { id = "admin", key = "change-me", allow = ["admin"] },
#   # rate_limit_per_minute defaults to 200 when omitted.
#   { id = "submit", key = "submit-key", allow = ["prover.submit"], rate_limit_per_minute = 600 },
# ]

[rpc]
# Explicitly allowed (network, l1_network) combinations for the hoodi-compatible API.
# Canonical configs should declare RPC endpoints here.
pairs = [
  { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", beacon_rpc = "https://ethereum-hoodi-beacon-api.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", l2_provider = "geth_local_witness" },
  # Optional: set beacon_rpc to override the L1 beacon endpoint used for Shasta blob sidecars.
  # When omitted, raiko2 uses the built-in beacon RPC from the resolved L1 chain spec.
  # Optional: route witness/debug traffic to a dedicated L2 endpoint.
  # l2_provider defaults to "reth". Set l2_provider = "geth" for geth native debug_executionWitness.
  # Set l2_provider = "geth_local_witness" for a regular geth endpoint with locally assembled witnesses.
  # { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", l2_provider = "geth", l2_witness_rpc = "https://rpc.hoodi.taiko.xyz" },
  # Optional: enable hosted SP1 network verification for a specific pair.
  # sp1_verifier_address is the Succinct SP1 PLONK gateway on L1, not the Taiko Shasta verifier.
  # Leave these fields unset to keep that line closed.
  # { network = "taiko_mainnet", l1_network = "ethereum", l1_rpc = "https://ethereum-rpc.publicnode.com", l2_rpc = "https://rpc.mainnet.taiko.xyz", l2_witness_rpc = "https://rpc.mainnet.taiko.xyz", sp1_verifier_rpc_url = "https://ethereum-rpc.publicnode.com", sp1_verifier_address = "0x3B6041173B80E77f038f3F2C0f9744f04837185e" },
  # Optional: override Boundless quote, offer, and runtime params per pair.
  # This only affects the `risc0/network` route. SP1 ignores it.
  # Leave fixed quote overrides unset unless the target network has stable proof sizes.
# { network = "taiko_mainnet", l1_network = "ethereum", l1_rpc = "https://ethereum-rpc.publicnode.com", l2_rpc = "https://taiko-rpc.publicnode.com", boundless = { aggregation_quote = { strategy = "evaluated" } } },
  # { network = "taiko_hoodi", l1_network = "hoodi", l1_rpc = "https://ethereum-hoodi-rpc.publicnode.com", l2_rpc = "https://rpc.hoodi.taiko.xyz", boundless = { aggregation_quote = { strategy = "evaluated" }, rebid_timeout_ms = 600000, rebid_price_step_bps = 3000, rebid_max_attempts = 2, offer_params = { batch = { pricing_mode = "market", absolute_max_price_per_mcycle = "0.000000600", ramp_up_start_sec = 20, ramp_up_period_sec = 120, lock_collateral = "20", timeouts = { mode = "per_mcycle", lock_timeout_ms_per_mcycle = 300, timeout_ms_per_mcycle = 900, dynamic_pricing_timeout_modifier = 2.0 } } } } },
]

[rpc.client]
timeout_ms = 600000
concurrency_limit = 32

[rpc.client.retry]
max_attempts = 4
initial_backoff_ms = 1000
compute_units_per_second = 1000

[runtime]
root = "./data/runtime"
inactive_ttl_secs = 7200

# Optional preflight cross-check against a second L2 RPC endpoint.
# Keys are L2 network names from rpc.pairs[*].network. Omit a network to skip verification.
# [preflight.verify_checkpoint_l2_rpcs]
# taiko_hoodi = "https://hoodi-l2-rpc.example.com"

[prover]
# Server default route.
# Supported routes:
# Public proof requests use proof_type = "risc0" or "sp1"; "zk_any" is sampling only.
# Internal regression environments may use proof_type = "native" with route native/local.
# Routes supported by server config:
#   risc0/local | risc0/network | sp1/local | sp1/network | native/local | sgx/remote
guest_system = "risc0"
runner = "local"

[prover.risc0]
bonsai = true
snark = true
mock = false
execution_po2 = 20

[prover.sp1]
mode = "prove"
prover = "network"
recursion = "plonk"
verify = true
network_mode = "reserved"
fulfillment_strategy = "reserved"
skip_simulation = true
cycle_limit = 1000000000000
# Optional SP1 stage-specific cycle limits. If unset, `cycle_limit` is used.
# proposal_cycle_limit = 1000000000000
# aggregation_cycle_limit = 1000000000000
timeout_secs = 7200
# rpc_url = "https://rpc.production.succinct.xyz"

[prover.boundless]
# Global default for the `risc0/network` route. Pair-specific overrides under `rpc.pairs[*].boundless`
# can replace `batch_quote`/`aggregation_quote`, runtime timeout/rebid fields,
# and either offer param block for selected pairs.
offchain = false
rpc_url = "https://base-rpc.publicnode.com"
signer_key = "0xYOUR_PRIVATE_KEY"
poll_interval_ms = 10000
timeout_ms = 3600000
# How long to wait for an unlocked market request before rebidding.
rebid_timeout_ms = 300000
# Each rebid escalates the offer max price by this many basis points, compounding per attempt
# (5000 = +50%/attempt: 1x, 1.5x, 2.25x, 3.375x, 5.06x ...). 0 = flat rebids. The base is the
# configured max price in manual mode, the SDK autopriced max price in market mode.
rebid_price_step_bps = 5000
# Maximum number of rebids across all retry paths (no-lock, expired, and timed-out
# requests share one budget); the proof task fails once it is exhausted. The default
# allows ~5x max price at the default step.
rebid_max_attempts = 4

# Optional request sampling policy for proof_type=zk_any.
# When disabled or not drawn, the server returns data.status = "zk_any_not_drawn"
# and does not register a task.
#
# [prover.zk_any.sp1]
# probability = 0.05
# per_day = 8
#
# [prover.zk_any.risc0]
# probability = 0.05
# per_day = 8

[prover.remote_sgx]
# For `proof_type=sgx`, point this at the dedicated SGX runtime (`raiko2-sgx-prover`). That
# runtime may run in `tee` or `native` mode.
base_url = "http://127.0.0.1:8081"
# For `proof_type=sgxgeth`, point this at the external geth-backed remote SGX server.
sgxgeth_base_url = "http://127.0.0.1:8090"
timeout_ms = 300000

[prover.boundless.deployment]
# Supported deployments: base, sepolia, taiko.
# Use taiko when submitting Boundless requests to the Taiko mainnet market.
deployment_type = "base"

[prover.boundless.deployment.overrides]
order_stream_url = "https://base-mainnet.boundless.network"

# Quote sizing per stage. Default `raiko_agent` rounds evaluated cycles up (batch: 1000-step,
# 2000 floor; aggregation: 100-step, 200 floor). Use `evaluated` for the honest cycle count,
# or `fixed` to pin the quote. A fixed quote underprices large proposals and overprices small ones.
[prover.boundless.batch_quote]
strategy = "raiko_agent"
# strategy = "fixed"
# mcycles = 6000

[prover.boundless.aggregation_quote]
strategy = "raiko_agent"
# strategy = "fixed"
# mcycles = 200

[prover.boundless.offer_params.batch]
pricing_mode = "market"
# Optional in market mode: clamp autopriced (and rebid-escalated) offers to this
# per-mcycle safety cap instead of failing them. Must be positive when set.
# `max_price_per_mcycle` is accepted as a legacy alias; set only one spelling.
absolute_max_price_per_mcycle = "0.000000600"
ramp_up_start_sec = 20
# Ramp-up duration in seconds (auction price climbs from min to max over this window).
ramp_up_period_sec = 120
lock_collateral = "20"
# pricing_mode = "manual", set both price fields. max price is a cap, not
# paid price; provers lock the ramping auction price. Caps below ~0.0000001 ETH/mcycle
# historically expired un-locked on Taiko market.
# max_price_per_mcycle = "0.0000006"
# min_price_per_mcycle = "0.000000010"
# Optional in manual mode: absolute ceiling on rebid escalation (>= max_price_per_mcycle).
# Without it, rebids escalate to max_price * rebid_price_multiplier ^ rebid_max_attempts.
# absolute_max_price_per_mcycle = "0.0000024"

[prover.boundless.offer_params.batch.timeouts]
# Derive lock/request timeouts from the quoted mcycles (per-mcycle, ms). In market mode they are
# scaled by dynamic_pricing_timeout_modifier; a fixed policy is not scaled.
mode = "per_mcycle"
lock_timeout_ms_per_mcycle = 300
timeout_ms_per_mcycle = 900
dynamic_pricing_timeout_modifier = 2.0
# --- or pin fixed seconds instead ---
# mode = "fixed"
# lock_timeout_secs = 600
# timeout_secs = 3600

[prover.boundless.offer_params.aggregation]
pricing_mode = "market"
ramp_up_start_sec = 20
# Ramp-up duration in seconds (auction price climbs from min to max over this window).
ramp_up_period_sec = 120
lock_collateral = "20"

[prover.boundless.offer_params.aggregation.timeouts]
mode = "per_mcycle"
lock_timeout_ms_per_mcycle = 3000
timeout_ms_per_mcycle = 6000
# Aggregation uses the `aggregation_quote` strategy above, so per-mcycle cap must also
# amortize prover overhead (~0.0000087 ETH).
# Manual caps below ~0.0000002 ETH/mcycle (= 0.00004 ETH total at 200 mcycles)
# rarely lock.
# max_price_per_mcycle = "0.0000008"
# min_price_per_mcycle = "0.000000006"
# absolute_max_price_per_mcycle = "0.0000032"

[queue]
backend = "memory"
namespace = "raiko2:queue"
workers = 6
maintenance_interval_ms = 200
# redis_url = "redis://localhost:6379/"
