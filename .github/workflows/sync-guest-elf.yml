name: sync-guest-elf

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Guest backend to rebuild
        required: true
        default: all
        type: choice
        options:
          - risc0
          - sp1
          - all
      ref:
        description: Branch to update; defaults to the branch this workflow was dispatched from
        required: false
        type: string

# Default to read-only at the workflow level. The sync job upgrades to
# contents: write only for the steps that push the rebuilt ELFs.
permissions:
  contents: read

concurrency:
  group: sync-guest-elf-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, raiko2]
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TARGET_REF_INPUT: ${{ inputs.ref }}
      DISPATCH_REF: ${{ github.ref_name }}
      # Inputs.backend is constrained to a choice list but we still pass it
      # via env to avoid templating user-controlled strings into shell.
      BACKEND_INPUT: ${{ inputs.backend }}
    steps:
      - name: resolve and validate target ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          # Trim only leading/trailing whitespace. We deliberately do NOT collapse
          # interior whitespace: any interior whitespace makes this an invalid
          # branch name, and the validation below must reject it loudly instead
          # of silently mutating "feat ure" into "feature".
          target_ref="${TARGET_REF_INPUT}"
          target_ref="${target_ref#"${target_ref%%[![:space:]]*}"}"
          target_ref="${target_ref%"${target_ref##*[![:space:]]}"}"
          if [ -z "${target_ref}" ]; then
            target_ref="${DISPATCH_REF}"
          fi
          # Reject anything that is not a well-formed branch name. This protects
          # the downstream `git push origin HEAD:<ref>` step from injection or
          # surprising refspecs (refs containing ':', '..', leading '-', etc.).
          if ! git check-ref-format --branch "${target_ref}" >/dev/null 2>&1; then
            echo "::error title=Invalid ref::Refusing to operate on malformed branch name: ${target_ref}"
            exit 1
          fi
          # Defense-in-depth: re-validate against an explicit allowlist character
          # class. git check-ref-format already rejects spaces, '..', '~', '^',
          # ':', '?', '*', '[', '\', control chars, and leading '-'.
          case "${target_ref}" in
            *[!A-Za-z0-9._/-]*)
              echo "::error title=Invalid ref::Branch name contains disallowed characters: ${target_ref}"
              exit 1
              ;;
          esac
          echo "ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved target ref: ${target_ref}"

      - name: validate backend input
        shell: bash
        run: |
          set -euo pipefail
          case "${BACKEND_INPUT}" in
            risc0|sp1|all) ;;
            *)
              echo "::error title=Invalid backend::backend must be one of risc0|sp1|all (got: ${BACKEND_INPUT})"
              exit 1
              ;;
          esac

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          # Push step below uses an explicit refspec; default GITHUB_TOKEN
          # credentials remain configured so `git push` works.
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: sync-guest-elf

      - uses: taiki-e/install-action@3f9f98517dede275478bf30d33e779b37701c7fa # just
        with:
          tool: just

      - name: build guest elfs
        shell: bash
        run: |
          set -euo pipefail
          just build-guest "${BACKEND_INPUT}"

      - name: upload guest elf outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-elf-sync-${{ inputs.backend }}
          path: crates/guests/elf/*.elf
          retention-days: 7

      - name: detect elf changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/guests/elf; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No ELF changes detected."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "ELF changes detected."
          fi

      - name: commit synced guest elfs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A stages additions, modifications, AND deletions inside the
          # path - required so the commit reflects rebuilt-away ELFs too.
          git add -A -- crates/guests/elf
          git commit -m "chore: sync guest elf outputs"

      - name: push synced guest elfs
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          # TARGET_REF is validated above; quote it to keep shell injection
          # impossible even if validation regressed.
          git push origin "HEAD:refs/heads/${TARGET_REF}"
