[package]
name = "raiko2-protocol-shasta"
version.workspace = true
edition.workspace = true
description = "Taiko Shasta protocol types and codecs for Raiko V2"

[lints]
workspace = true

[dependencies]
raiko2-protocol.workspace = true
taiko-client-protocol = { git = "https://github.com/taikoxyz/taiko-mono", rev = "34c446de200a0856863615936c8ce1e94097981f", package = "protocol" }

# Alloy types
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-rlp.workspace = true
alloy-eips.workspace = true
reth-ethereum-primitives.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
flate2.workspace = true

# Logging
tracing.workspace = true

[features]
default = []
