[package]
name = "raiko2-guest-common"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
etna-core.workspace = true
raiko2-primitives = { path = "../primitives", default-features = false }
raiko2-primitives-shasta = { path = "../primitives-shasta" }
raiko2-protocol = { path = "../protocol" }
raiko2-protocol-etna.workspace = true
raiko2-protocol-shasta = { path = "../protocol-shasta" }
raiko2-stateless = { path = "../stateless" }
taiko-client-protocol.workspace = true
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", rev = "9ecf843d9f753127a703c39786b040b753c40edd", default-features = false }
alethia-reth-block = { git = "https://github.com/taikoxyz/alethia-reth", rev = "9ecf843d9f753127a703c39786b040b753c40edd", default-features = false, features = [
    "prover",
    "serde",
] }
alethia-reth-consensus.workspace = true
alethia-reth-primitives = { git = "https://github.com/taikoxyz/alethia-reth", rev = "9ecf843d9f753127a703c39786b040b753c40edd", default-features = false }
alloy-primitives = { version = "=1.6.1", default-features = false }
alloy-consensus = { version = "=2.5.0", default-features = false, features = ["serde"] }
alloy-eips = { version = "=1.8.3", default-features = false }
alloy-eips-execution = { package = "alloy-eips", version = "=2.5.0", default-features = false }
alloy-sol-types = { version = "=1.6.1", default-features = false }
alloy-rlp = { version = "=0.3.16", default-features = false }
alloy-hardforks = "=0.4.9"
anyhow = "=1.0.102"
flate2 = { workspace = true, features = ["zlib"] }
reth-ethereum-primitives = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.7.0-1", default-features = false, features = [
    "serde",
] }

[dev-dependencies]
alloy-trie.workspace = true
reth-evm.workspace = true
reth-revm.workspace = true
reth-primitives-traits.workspace = true
reth-trie-common.workspace = true
sha2.workspace = true
raiko2-primitives = { path = "../primitives", features = ["chain-spec-json", "kzg-host"] }
alloy-signer = { version = "2.0", default-features = false }
alloy-signer-local = { version = "2.0", default-features = false }
risc0-ethereum-trie.workspace = true

[features]
default = []
bench = []
